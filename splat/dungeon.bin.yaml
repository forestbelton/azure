name: dungeon.bin
sha1: 27f9fcc384a570a991e349b920881e7070c0e13c
options:
  basename: dungeon.bin
  target_path: data/dungeon/dungeon.bin
  base_path: ..
  platform: psx
  compiler: GCC

  create_asm_dependencies: False

  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_dependencies: False
  # TODO: We may be able to turn this off once more of the binary is mapped
  ld_legacy_generation: True
  ld_script_path: build/dungeon.bin.ld

  subalign: 4

  find_file_boundaries: False
  gp_value: 0x80080994

  o_as_suffix: True
  use_legacy_include_asm: False

  # Namespaced like main.bin's: without this both this config and
  # town.bin's would write their offset-0 bin into the default assets/.
  asset_path: assets/dungeon
  src_path: csrc

  symbol_addrs_path: splat/dungeon.bin_symbol_addrs.txt
  reloc_addrs_path: splat/dungeon.bin_reloc_addrs.txt

  undefined_funcs_auto_path: splat/dungeon.bin_undefined_funcs_auto.txt
  undefined_syms_auto_path: splat/dungeon.bin_undefined_syms_auto.txt
segments:
  - [0x0, bin]
  # The dungeon overlay: 863 functions at 0x80088760 -- the SAME address as
  # town.bin's overlay, the first byte after the resident engine's last
  # (0x8008875F). The two are therefore mutually exclusive at runtime, and an
  # address in this range means different code depending on which is
  # resident; docs/overlays.md has the consequences for mapping them.
  #
  # Located by matching the 49 overlay function addresses in
  # slus_006.14_undefined_funcs_auto.txt against this file's
  # `addiu sp,sp,-N` prologues (12/49 at this delta, next best 6), then
  # confirmed by the block's own jal targets landing on its own prologues
  # (353 hits, noise floor 0). The code reaches 0x800DCCF4, which covers the
  # isolated 0x800D5460 that docs/overlays.md listed as "a different region".
  #
  # Confirmed against live behaviour, like town's and main.bin's: a
  # PCSX-Redux CD-ROM command log shows the game seeking LBA 12636 =
  # dungeon.bin+0xa3000, and it is the most-requested address of the whole
  # dungeon session (21 seeks), which is what reloading an overlay per floor
  # looks like.
  #
  # THIS IS NOT THE ONLY CODE OVERLAY IN THIS CONTAINER, and the claim that it
  # was is withdrawn. It said: "the seeks at +0x2a3000, +0x4a3000 and so on are
  # assets and low-RAM data, not more overlays: assuming the same 0x80088760
  # base at those offsets scores 0-45 against this one's 353". The scores were
  # right and the inference was wrong -- a bank that loads at 0x8001d4xx or
  # 0x8016e800 scores nothing at the 0x80088760 base BECAUSE THE BASE IS
  # WRONG, so a low score there is not evidence of absence. The prologue vote
  # can only rank bases for a span you already suspect; used as a search it
  # has no power, and that is how about two hundred further code objects came
  # to be filed as assets.
  #
  # `tools/decomp/codemap.py` searches instead of ranking, by scoring a delta
  # on whether internal `jal` targets land two words after a `jr $ra` -- a
  # function start, since cc1psx emits functions back to back. It takes this
  # overlay at 456 of 456 internal targets (100%) against 4% for the
  # runner-up, where the prologue vote managed 1484 against 374, and that
  # margin is what makes a blind sweep over 26 MB possible. docs/dungeon-map.md
  # has the resulting map; the short version is that +0x2a3000 is a real code
  # overlay whose jump table into 0x8001d4xx is a jump table into ITSELF, and
  # that 0x995000..0x12ed000 holds 47 banked overlays of 0x6000 bytes each,
  # stored as seven relinked copies -- one per RAM slot.
  #
  # COUNTED 2026-11-22, replacing the "~195 banked overlays" and the "at most
  # 118 distinct" this note and codemap.py's sweep reported: both were sweep
  # BOUNDS, and both were too high, because a sector-granular window over a
  # family of relinked copies splits families and because a fingerprint taken
  # over the full 0x6000 counts the mastering filler past an object's end.
  # The count comes from the loaders instead, which are landed C:
  # func_800A0B94 in this overlay reads bank (a, i) from
  # `LBA = (a - 1) * 84 + i * 12 + 0x4340` to `dest = 0x80170800 - i * 0x6000`,
  # `nsec = 0xC`, and func_800A982C reads a second family from
  # `LBA = (a - 1) * 12 + 0x607F` to a FIXED 0x80024000, one copy each.
  # dungeon.bin starts at LBA 12310, so both become file offsets, and all 329
  # predicted banks pin at the slot address the formula computes.
  # tools/decomp/dungeon_objects.py enumerates them; 116 objects, 304,495
  # distinct words, stored as 1,573,372.
  #
  # rodata first, code from +0xa3d40 (gcc -G8 data-before-functions).
  #
  # CORRECTED 2026-11-09, having been KNOWN WRONG BY 58 WORDS: the text starts
  # at +0xa3d40 (vram 0x800894A0), not the +0xa3e28 this file declared, and the
  # overlay is 863 functions / 85,616 words rather than 862. Re-split and
  # `make containers` is byte-identical with the corrected boundary, and
  # func_800894A0 now has a listing of its own. What sits in 0x800894A0..
  # 0x80089588 is one entire function -- `addiu $sp, $sp, -0x20`, $s0/$s1/$ra
  # saved, eight `jal`s (0x80040190, 0x800401FC, 0x8004027C, 0x8004D70C,
  # 0x800D13B8, 0x800CF8E4, 0x800897E4 and, last, 0x80089588 which is the
  # declared text start), then the matching restores, `addiu $sp, $sp, 0x20`
  # and `jr $ra`. The data genuinely ends at +0xa3d40: 0x80089490..0x8008949C
  # is the tail of a repeating 2-word record pattern.
  #
  # The reason the fingerprinting missed it is the same reason it missed four
  # functions in town.bin (see that yaml): the boundary was placed where the
  # CONFIRMED prologue run began, and a function below that run casts no vote
  # of its own unless something inside the split text `jal`s to it. Nothing
  # here does -- this one is reached from outside the block -- so no `func_`
  # symbol was ever created for it and it reads as rodata.
  #
  # Both ends were re-checked independently before the boundary moved: the word
  # at +0xa3d40 is `27bdffe0`, the four words below it are the
  # `01c801c0 / 0010001c` 2-word record pattern this note predicted, and the
  # last `jr $ra` is at +0xf76f8 with its delay slot at +0xf76fc.
  # `.rodata` WITH the dot, because csrc/ovl_dungeon.c exists: splat refuses
  # the undotted form for a segment that has a sibling C unit, and without a
  # sibling the dot extracts nothing and every reference into the overlay's
  # own rodata comes out undefined. The two halves of that rule are why this
  # line changed in the same commit that created the C file
  # (docs/overlays.md, "The rodata dot").
  #
  # The other two corrections eec0572 worked out on town.bin still apply: a
  # FOLLOWING segment, or the code subsegment runs to the end of the
  # container; and a text end on a 16-byte boundary, because splat emits
  # `__romPos = ALIGN(__romPos, 16)` after a code segment and a boundary off
  # that grid pads the container.
  #
  # The text ends at 0xf7700: the last `jr $ra` is at 0xf76f8 and its delay
  # slot follows. The 0xf8000 the old bin split used is 0x900 bytes past it.
  #
  # SEVEN of this block's 28 jump tables sit at 4 mod 8 (jtbl_80088D7C,
  # 800892CC, 800892E4, 8008938C, 800893E4, 80089454, 80089474). While their
  # functions are INCLUDE_ASM that costs nothing -- splat migrates each table
  # into its function's listing and emits it verbatim -- but cc1psx writes
  # `.align 3` before a table it compiles, so the first of those seven to be
  # landed needs a unit whose rodata STARTS at a 4-mod-8 address, where the
  # directive is a no-op. That is the same forced carve town.bin took; see
  # splat/town.bin.yaml and docs/overlays.md.
  - type: code
    start: 0xa3000
    vram: 0x80088760
    subsegments:
      - [0xa3000, .rodata, ovl_dungeon]
      # THE CARVE, 2026-11-20. Four of this block's jump tables sit at a
      # 4-mod-8 rodata offset -- jtbl_8008938C (0xc2c), jtbl_800893E4
      # (0xc84), jtbl_80089454 (0xcf4) and jtbl_80089474 (0xd14) -- and
      # cc1psx writes `.align 3` before every table it compiles, so the
      # first of their functions to be landed inside one big ovl_dungeon.c
      # gains four bytes of pad the reference does not have, .rodata grows
      # and the container comes out eight bytes long.
      #
      # 0xa3c2c is rodata offset 0xc2c, which is jtbl_8008938C itself. With
      # this unit's rodata starting there, all four tables are 0 mod 8
      # relative to the unit and the directive is a no-op. `subalign: 4`
      # above (plus SUBALIGN(4) in the generated linker script) is what
      # lets the section land at 4 mod 8 at all -- without it ld would
      # bump it to 8 and the pad comes back.
      #
      # 0xdd0c4 is func_800C2824, the first function whose rodata is at or
      # after 0xc2c, and the two boundaries have to name the SAME function:
      # cc1psx emits a unit's rodata in function order, so a code split
      # anywhere else puts a table on the wrong side of the rodata split
      # and the link fails with an undefined reference.
      #
      # The THREE remaining 4-mod-8 tables -- jtbl_80088D7C (0x61c),
      # jtbl_800892CC (0xb6c) and jtbl_800892E4 (0xb84) -- stay in the head
      # unit and cost nothing there, because func_8009F644, func_800B45E0
      # and func_800B490C are still INCLUDE_ASM and splat emits their
      # tables verbatim with no `.align` at all. Landing those three needs
      # two more splits, at 0x61c and 0xb6c. Their bodies are parked in
      # docs/dungeon-parks/.
      # THE SECOND CARVE, 2026-11-20. jtbl_800892CC (0xb6c) and jtbl_800892E4
      # (0xb84) are the 4-mod-8 tables of func_800B45E0 and func_800B490C;
      # relative to a unit starting at 0xb6c they are 0 and 0x18, so the
      # `.align 3` is a no-op for both. 0xa3bb0 is jtbl_80089310 --
      # func_800B6AC4's, 0 mod 8 absolutely, so it would be 4 mod 8 inside the
      # 0xb6c unit and has to start one of its own. That is the same inversion
      # the first carve learned the hard way; splat prints both splits under
      # "File split suggestions".
      # THE THIRD CARVE, 2026-11-22, for func_8009F644 -- and it needs TWO
      # splits, not one, for exactly the reason the second carve records
      # below: splitting at a 4-mod-8 offset INVERTS the alignment class of
      # every other table in the new unit.
      #
      # 0xa361c is jtbl_80088D7C itself, func_8009F644's table, so relative to
      # this unit it is 0 mod 8 and the `.align 3' is a no-op. But THREE other
      # tables fall in [0x61c, 0xb6c) and ALL THREE invert:
      #
      #   jtbl_80089008 (0x8a8, func_800A4B88)  -> 0x28c rel, 4 mod 8
      #   jtbl_80089088 (0x928, func_800ADE74)  -> 0x30c rel, 4 mod 8
      #   jtbl_800891C0 (0xa60, func_800B348C)  -> 0x444 rel, 4 mod 8
      #
      # func_800ADE74 is still INCLUDE_ASM, so splat emits its table verbatim
      # and it costs nothing while that park is open. But **func_800A4B88 AND
      # func_800B348C ARE BOTH LANDED**, so a single split at 0x61c would put
      # `.align 3' before their compiled tables and the container would come
      # out eight bytes long -- the identical failure the first carve hit and
      # the second carve documents below.
      #
      # splat SAYS SO ITSELF: run it with only the 0x61c split and it prints
      # `- [0xA38A8, .rodata]' under "File split suggestions". Read them. A
      # first pass here enumerated the tables with a grep that took only the
      # FIRST one per listing file and therefore missed jtbl_80089008
      # entirely; splat caught it.
      #
      # So THREE splits. 0xa38a8 is jtbl_80089008 and 0xa3a60 is
      # jtbl_800891C0, each 0 mod 8 relative to its own unit. And 0x8a8 pays a
      # bonus: jtbl_80089088 lands at 0x80 relative to it, which is 0 mod 8,
      # so func_800ADE74 will NOT need a fourth carve when its park lands.
      - [0xa361c, .rodata, ovl_dungeon_8009F644]
      - [0xa38a8, .rodata, ovl_dungeon_800A4B88]
      - [0xa3a60, .rodata, ovl_dungeon_800B348C]
      - [0xa3b6c, .rodata, ovl_dungeon_800B45E0]
      - [0xa3bb0, .rodata, ovl_dungeon_800B6AC4]
      - [0xa3c2c, .rodata, ovl_dungeon_800C2824]
      # AND THE MIDDLE ONE, which is the part that is easy to get wrong.
      # Splitting at a 4-mod-8 offset INVERTS the alignment class for every
      # other table in the new unit: the compiled table at 0xce0 (vram
      # 0x80089440, five entries, owned by the LANDED func_800CABA8) is 0 mod
      # 8 absolutely and was fine inside one unit, but 4 mod 8 relative to
      # 0xc2c -- so a single split at 0xc2c pads IT instead and the container
      # still comes out eight bytes long. That is what the first attempt did.
      # splat says so itself, in the "File split suggestions" it prints on
      # every run; read them.
      - [0xa3ce0, .rodata, ovl_dungeon_800CABA8]
      - [0xa3cf4, .rodata, ovl_dungeon_800D50FC]
      - [0xa3d40, c, ovl_dungeon]
      # The code boundaries name the SAME functions as the rodata ones, which
      # the first carve learned the hard way: cc1psx emits a unit's rodata in
      # function order, so a code split anywhere else puts a table on the
      # wrong side of the rodata split and the link fails undefined.
      - [0xb9ee4, c, ovl_dungeon_8009F644]
      - [0xbf428, c, ovl_dungeon_800A4B88]
      - [0xcdd2c, c, ovl_dungeon_800B348C]
      - [0xcee80, c, ovl_dungeon_800B45E0]
      - [0xd1364, c, ovl_dungeon_800B6AC4]
      - [0xdd0c4, c, ovl_dungeon_800C2824]
      - [0xe5448, c, ovl_dungeon_800CABA8]
      - [0xef99c, c, ovl_dungeon_800D50FC]
  - [0xf7700, bin]
  # THE FIRST OF THE BANKED OBJECTS, 2026-11-22. docs/dungeon-map.md section 2
  # has the family: func_800A0B94 reads bank (a, i) from
  # LBA (a-1)*84 + i*12 + 0x4340 to dest 0x80170800 - i*0x6000, 0xC sectors,
  # and dungeon.bin starts at LBA 12310. This is a = 1, i = 0 -- the first
  # object of the family and the first of its seven relinked copies.
  #
  # ONLY SLOT 0 IS SPLIT. The six copies at 0x99b000, 0x9a1000, 0x9a7000,
  # 0x9ad000, 0x9b3000 and 0x9b9000 are the SAME object relinked 0x6000 lower
  # each time; splitting them too would be six more namespaces for one body of
  # code. They stay `bin` and the container still rebuilds byte-identical,
  # because a bin segment is dumped and relinked verbatim.
  #
  # symbol_name_format IS NOT OPTIONAL HERE. Every object of this family loads
  # at 0x80170800, so 47 of them would generate the same `func_801708E8` and
  # collide in dungeon.bin's single link. The per-segment format gives this one
  # `func_b01_801708E8`. It is the ROM case only -- `symbol_name_format_no_rom`
  # is left alone on purpose, because out-of-segment references (the resident
  # engine's func_8003A7C4 and the like) have no segment at all and fall
  # through to the global format, which is what keeps them shared across every
  # object instead of being aliased 47 times in
  # splat/dungeon.bin_undefined_funcs_auto.txt.
  #
  # exclusive_ram_id puts this object in its own RAM space, so a reference to
  # 0x801708E8 from inside it resolves to ITS function and not to whichever
  # other object splat happened to scan first.
  #
  # The layout is data / text / data, measured rather than assumed:
  #   +0x0000..+0x00e8  58 pointer words into this object's own text -- the
  #                     dispatch table every object in both families starts
  #                     with. The word at +0x00e4 is 0x80173a08, a pointer.
  #   +0x00e8..+0x38e0  text. +0x00e8 is `27bdffe8`. THE TEXT DOES NOT START
  #                     AT THE ENTRY POINTER: the head word is 0x80170bb0,
  #                     +0x3b0, and the functions below it are reached only
  #                     through the dispatch table. 13 of the 47 are like this,
  #                     so splitting from the entry would lose them.
  #   +0x38e0..+0x39c4  byte tables, then 19 more pointer words -- two of them
  #                     (0x800a9c10, 0x800acbe4) into the dungeon overlay, so
  #                     this object is resident alongside it.
  #   +0x39c4..+0x6000  mastering filler. It differs between the seven copies
  #                     where everything above it differs only by the relink,
  #                     which is how the object's end was found.
  #
  # The segment ends at 0x9989d0 -- +0x39c4 rounded up to 16 -- because splat
  # emits `__romPos = ALIGN(__romPos, 16)` after a code segment and a boundary
  # off that grid pads the container. The same rule the overlay's own note and
  # town.bin's record.
  - name: ovl_dng_b01
    type: code
    start: 0x995000
    vram: 0x80170800
    exclusive_ram_id: dng_b01
    symbol_name_format: b01_$VRAM
    subsegments:
      - [0x995000, data]
      - [0x9950e8, c, ovl_dng_b01]
      - [0x9988e0, data]
  - [0x9989d0, bin]
  - [0x1a86800]

name: main.bin
sha1: 69f63236b7ab2260e2e9aa2048ce7aa540bdbe6d
options:
  basename: main.bin
  target_path: data/main/main.bin
  base_path: ..
  platform: psx
  compiler: GCC
  extensions_path: splat/ext

  create_asm_dependencies: False

  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_dependencies: False
  # TODO: We may be able to turn this off once more of the binary is mapped
  ld_legacy_generation: True
  ld_script_path: build/main.bin.ld

  subalign: 4

  find_file_boundaries: False
  gp_value: 0x80080994

  o_as_suffix: True
  use_legacy_include_asm: False

  asset_path: assets/main
  src_path: csrc

  symbol_addrs_path: splat/main.bin_symbol_addrs.txt
  reloc_addrs_path: splat/main.bin_reloc_addrs.txt

  undefined_funcs_auto_path: splat/main.bin_undefined_funcs_auto.txt
  undefined_syms_auto_path: splat/main.bin_undefined_syms_auto.txt
segments:
  - [0x0, bin, song1.kdt]
  - [0x3000, bin, snd_bank.vh]
  - [0x4020, pad]
  - [0x4800, bin, snd_bank.vb]
  - [0x1faf0, pad]
  - [0x20000, bin, kewne_loading_img]
  - type: hrodata
    start: 0x20800
    vram: 0x8002C000
    name: str/monsters
  - type: code
    start: 0x21268
    vram: 0x8002CA68
    align: 4
    subsegments:
      - [0x21268, .rodata, main_tables_21268]
  - [0x21768, pad]
  # The GAME OPTION overlay, loaded to 0x80088760 by the CD queue descriptor
  # at vram 0x80080C38.
  - type: code
    start: 0x21800
    vram: 0x80088760
    subsegments:
      - [0x21800, .rodata, ovl_main_80088760]
      - [0x21830, .rodata, ovl_main_80089608]
      - [0x21894, hrodata, str/options]
      - [0x2194c, .rodata, ovl_main_8008A288]
      - [0x21968, c, ovl_main_80088760]
      - [0x226a8, c, ovl_main_80089608]
      - [0x23328, c, ovl_main_8008A288]
      - [0x24114, data, ovl_main_80088760_data]
  - [0x24420, pad]
  # NB: 2 MB of mastered random filler. (?)
  - [0x28420, bin, unread_filler]
  - [0x221800, bin, unk_img_1]
  - [0x226800, bin, title_bg_img]
  - [0x257000, bin, title_menu_img]
  - [0x258800, bin, unk_img_2]
  # The 0x80020000 card overlay, owned in full by csrc/main/*.c plus
  # csrc/ovl_main_80020000.c
  - type: code
    start: 0x25d000
    vram: 0x80020000
    subsegments:
      - [0x25d000, .rodata, main/c_server]
      - [0x25d0a0, .rodata, main/card_mes]
      - [0x25d0a4, .rodata, main/cardbk]
      - [0x25d0a8, .rodata, main/cardinfo]
      - [0x25d0c0, .rodata, main/memory]
      - [0x25d924, c, main/c_server]
      - [0x25f25c, c, main/card_mes]
      - [0x260258, c, main/card_opt]
      - [0x260a78, c, main/card_win]
      - [0x2612d8, c, main/cardbk]
      - [0x261390, c, main/cardinfo]
      - [0x2631c0, c, main/cardslot]
      - [0x264018, c, main/cardsme]
      - [0x26489c, c, main/memory]
      - [0x264e20, .data, main/c_server]
      - [0x264f60, .data, main/card_mes]
      - [0x264f68, .data, main/card_opt]
      - [0x264f7c, .data, main/card_win]
      - [0x264fd0, .data, main/cardbk]
      - [0x264fd4, .data, main/cardinfo]
      - [0x265068, .data, main/cardslot]
      - [0x265094, .data, main/cardsme]
      - [0x2650b4, .data, main/memory]
      - [0x265530, .data, ovl_main_80020000]
      - [0x268b6c, pad]
  # The 0x80400000 debug twin of the overlay above. Requires -G8 in the build
  # and a different version of the compiler.
  - type: code
    start: 0x269000
    vram: 0x80400000
    subsegments:
      # CARVED INTO ITS NINE TRANSLATION UNITS, 2026-11-13. The block's own
      # rodata names them: each original unit carries its own ASSERT_FMT copy
      # followed by its own __FILE__ string, and all nine are here in link
      # order -- c_server.c at 0x8040002C, then card_mes.c, card_opt.c,
      # card_win.c, cardbk.c, cardinfo.c, cardslot.c, cardsme.c, memory.c.
      # Each unit's rodata therefore STARTS at its assert pair, which is what
      # fixes the ten `.rodata` windows below; the text boundaries come from
      # the twin-to-live pair map in csrc/main_twin.h. Six of the eight text
      # boundaries are DETERMINED by a pair on each side; three gaps are
      # inferred. See docs/overlays.md, "Carving the twin", for which.
      #
      # TEN UNITS FOR NINE TRANSLATION UNITS: c_server.c is split in two, at
      # func_804016D0. Its rodata runs [7 objects][jtbl_8040007C][0x4B8 more]
      # with the table in the MIDDLE, and at -G8 cc1psx appends the text
      # stream after all file-scope data (mips.c:4181), so a table always
      # lands LAST in its unit and one unit cannot produce that order. This is
      # docs/owning-data.md SS9.1, and it is the same constraint that used to
      # need a separate rodata unit. Splitting at the function that emits the
      # table is the same move ovl_town makes at func_800BEBA4.
      #
      # The tail unit keeps the name ovl_main_80400000 and is NOT one of the
      # nine: from 0x8040855C it is the statically linked PSY-Q library
      # objects (docs/twin-block-libcard.md), still asm stubs. It also still
      # holds the whole 0x3C48 `.data` window -- that region's per-unit
      # partition is known but not yet applied, see docs/overlays.md.
      #
      # Build flags for csrc/main_twin/ are their own Makefile rules: -G8, the
      # 4.0-era compiler, --expand-div and the jump-table alignment filter.
      # They match neither `ovl_%` nor `main/%`, both of which are -G0.
      - [0x269000, .rodata, main_twin/c_server_a]
      - [0x269090, .rodata, main_twin/c_server_b]
      - [0x269548, .rodata, main_twin/card_mes]
      - [0x2695a0, .rodata, main_twin/card_opt]
      - [0x2695f8, .rodata, main_twin/card_win]
      - [0x26962c, .rodata, main_twin/cardbk]
      - [0x269738, .rodata, main_twin/cardinfo]
      - [0x2697a4, .rodata, main_twin/cardslot]
      - [0x2697d8, .rodata, main_twin/cardsme]
      - [0x26986c, .rodata, main_twin/memory]
      - [0x2698a0, c, main_twin/c_server_a]
      - [0x26a7ec, c, main_twin/c_server_b]
      - [0x26b508, c, main_twin/card_mes]
      - [0x26c4d8, c, main_twin/card_opt]
      - [0x26cda0, c, main_twin/card_win]
      - [0x26d6c8, c, main_twin/cardbk]
      - [0x26dea0, c, main_twin/cardinfo]
      - [0x26f9fc, c, main_twin/cardslot]
      - [0x27089c, c, main_twin/cardsme]
      - [0x2711ac, c, main_twin/memory]
      - [0x27155c, c, ovl_main_80400000]
      - [0x2719e0, .data, ovl_main_80400000]
      - [0x275628, pad]
  - [0x275800]

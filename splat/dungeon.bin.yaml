name: dungeon.bin
sha1: 27f9fcc384a570a991e349b920881e7070c0e13c
options:
  basename: dungeon.bin
  target_path: data/dungeon/dungeon.bin
  base_path: ..
  platform: psx
  compiler: GCC
  extensions_path: splat/ext

  create_asm_dependencies: False

  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_dependencies: False
  # TODO: We may be able to turn this off once more of the binary is mapped
  ld_legacy_generation: True
  ld_script_path: build/dungeon.bin.ld

  subalign: 4

  find_file_boundaries: False
  gp_value: 0x80080994

  o_as_suffix: True
  use_legacy_include_asm: False

  # Namespaced like main.bin's: without this both this config and
  # town.bin's would write their offset-0 bin into the default assets/.
  asset_path: assets/dungeon

  symbol_addrs_path: splat/dungeon.bin_symbol_addrs.txt
  reloc_addrs_path: splat/dungeon.bin_reloc_addrs.txt

  undefined_funcs_auto_path: splat/dungeon.bin_undefined_funcs_auto.txt
  undefined_syms_auto_path: splat/dungeon.bin_undefined_syms_auto.txt
segments:
  - [0x0, bin]
  # The dungeon overlay: 863 functions at 0x80088760 -- the SAME address as
  # town.bin's overlay, the first byte after the resident engine's last
  # (0x8008875F). The two are therefore mutually exclusive at runtime, and an
  # address in this range means different code depending on which is
  # resident; docs/overlays.md has the consequences for mapping them.
  #
  # Located by matching the 49 overlay function addresses in
  # slus_006.14_undefined_funcs_auto.txt against this file's
  # `addiu sp,sp,-N` prologues (12/49 at this delta, next best 6), then
  # confirmed by the block's own jal targets landing on its own prologues
  # (353 hits, noise floor 0). The code reaches 0x800DCCF4, which covers the
  # isolated 0x800D5460 that docs/overlays.md listed as "a different region".
  #
  # Confirmed against live behaviour, like town's and main.bin's: a
  # PCSX-Redux CD-ROM command log shows the game seeking LBA 12636 =
  # dungeon.bin+0xa3000, and it is the most-requested address of the whole
  # dungeon session (21 seeks), which is what reloading an overlay per floor
  # looks like.
  #
  # THIS IS NOT THE ONLY CODE OVERLAY IN THIS CONTAINER, and the claim that it
  # was is withdrawn. It said: "the seeks at +0x2a3000, +0x4a3000 and so on are
  # assets and low-RAM data, not more overlays: assuming the same 0x80088760
  # base at those offsets scores 0-45 against this one's 353". The scores were
  # right and the inference was wrong -- a bank that loads at 0x8001d4xx or
  # 0x8016e800 scores nothing at the 0x80088760 base BECAUSE THE BASE IS
  # WRONG, so a low score there is not evidence of absence. The prologue vote
  # can only rank bases for a span you already suspect; used as a search it
  # has no power, and that is how about two hundred further code objects came
  # to be filed as assets.
  #
  # `tools/decomp/codemap.py` searches instead of ranking, by scoring a delta
  # on whether internal `jal` targets land two words after a `jr $ra` -- a
  # function start, since cc1psx emits functions back to back. It takes this
  # overlay at 456 of 456 internal targets (100%) against 4% for the
  # runner-up, where the prologue vote managed 1484 against 374, and that
  # margin is what makes a blind sweep over 26 MB possible. docs/dungeon-map.md
  # has the resulting map; the short version is that +0x2a3000 is a real code
  # overlay whose jump table into 0x8001d4xx is a jump table into ITSELF, and
  # that file 0x9bd800..0x135e000 holds ~195 banked overlays of 0x6000 bytes
  # each, stored as seven relinked copies -- one per RAM slot -- which
  # func_800A0B94 in this very overlay loads with
  # `dest = 0x80170800 - i * 0x6000`, `nsec = 0xC`.
  #
  # rodata first, code from +0xa3d40 (gcc -G8 data-before-functions).
  #
  # CORRECTED 2026-11-09, having been KNOWN WRONG BY 58 WORDS: the text starts
  # at +0xa3d40 (vram 0x800894A0), not the +0xa3e28 this file declared, and the
  # overlay is 863 functions / 85,616 words rather than 862. Re-split and
  # `make containers` is byte-identical with the corrected boundary, and
  # func_800894A0 now has a listing of its own. What sits in 0x800894A0..
  # 0x80089588 is one entire function -- `addiu $sp, $sp, -0x20`, $s0/$s1/$ra
  # saved, eight `jal`s (0x80040190, 0x800401FC, 0x8004027C, 0x8004D70C,
  # 0x800D13B8, 0x800CF8E4, 0x800897E4 and, last, 0x80089588 which is the
  # declared text start), then the matching restores, `addiu $sp, $sp, 0x20`
  # and `jr $ra`. The data genuinely ends at +0xa3d40: 0x80089490..0x8008949C
  # is the tail of a repeating 2-word record pattern.
  #
  # The reason the fingerprinting missed it is the same reason it missed four
  # functions in town.bin (see that yaml): the boundary was placed where the
  # CONFIRMED prologue run began, and a function below that run casts no vote
  # of its own unless something inside the split text `jal`s to it. Nothing
  # here does -- this one is reached from outside the block -- so no `func_`
  # symbol was ever created for it and it reads as rodata.
  #
  # Both ends were re-checked independently before the boundary moved: the word
  # at +0xa3d40 is `27bdffe0`, the four words below it are the
  # `01c801c0 / 0010001c` 2-word record pattern this note predicted, and the
  # last `jr $ra` is at +0xf76f8 with its delay slot at +0xf76fc.
  # The three corrections eec0572 worked out on town.bin apply here unchanged:
  # `rodata` and not `.rodata` while this overlay is `asm` -- the dot routes
  # the subsegment to a sibling C object and extracts nothing, so every
  # reference into the overlay's own rodata comes out undefined, and the rule
  # INVERTS the moment a csrc/ovl_dungeon.c exists, because splat then refuses
  # the undotted form outright (docs/overlays.md, "The rodata dot"); a FOLLOWING segment, or the code subsegment
  # runs to the end of the container; and a text end on a 16-byte boundary,
  # because splat emits `__romPos = ALIGN(__romPos, 16)` after a code segment
  # and a boundary off that grid pads the container.
  #
  # The text ends at 0xf7700: the last `jr $ra` is at 0xf76f8 and its delay
  # slot follows. The 0xf8000 the old bin split used is 0x900 bytes past it.
  - type: code
    start: 0xa3000
    vram: 0x80088760
    subsegments:
      - [0xa3000, rodata, ovl_dungeon]
      - [0xa3d40, asm, ovl_dungeon]
  - [0xf7700, bin]
  - [0x1a86800]

  undefined_syms_auto_path: splat/slus_006.14_undefined_syms_auto.txt
segments:
  - [0x0, header]
  # 0x800-0x69F4 is the pre-text data region, and the fifteen segments below
  # carve it up. That split is NOT required by splat 0.50.1.
  #
  # This comment used to read "a segment groups its entries by section, so one
  # segment can hold only one `.rodata` run", and justified the split by
  # claiming a `.rodata` subsegment added to the single old segment would drag
  # the str/name/* strings to 0x8002D5C0. That is FALSE. ld_legacy_generation
  # emits explicitly declared subsegments in declared OFFSET order whatever
  # their section, and `_X_SECTION_START`/`_END` are only brackets dropped at
  # the first and last occurrence of each section. Three independent checks:
  #   - retyping psyq/libcd from `data` to `rodata`, sitting between two
  #     `data` subsegments, builds byte-identical;
  #   - merging 0x800, 0xE30 and 0xE7C into one segment of four subsegments
  #     (one `rodata` plus three `.rodata` naming three DIFFERENT C units)
  #     builds byte-identical;
  #   - the name table's `.rodata` at 0x541D0 (asrc/names.s) sits between
  #     `data` subsegments at 0x3E01C and 0x5426C, in the same segment, and
  #     holds a `.word` that used to be a `data` subsegment of its own.
  # What IS grouped is the non-primary sections of `asm`/`c` subsegments:
  # their .data/.rodata/.bss are emitted in blocks after the text group. That
  # is the real constraint, and it is why a unit owning two SEPARATED .rodata
  # runs must be cut into two units -- an object has one .rodata and a dotted
  # `.rodata` subsegment can pull it to one offset only (unk_1C540, see
  # docs/open-matching-problems.md).
  #
  # The segments are left as they are because they work and byte-identity is
  # the only thing that matters here, but do not propagate the reasoning, and
  # do not add a segment just to place a `.rodata` next to a `data`.
  #
  # `align: 4` IS still required: the default segment align is 16 and
  # `_end_segment` emits ALIGN(__romPos, 16), which would pad a segment
  # ending at 0x8002D67C and shift every later byte.
  - type: code
    start: 0x800
    vram: 0x8002D000
    align: 4
    subsegments:
      # NB: 0x800 was added to all the offsets here to account for start addr
      - [0x800, rodata, str_pool_800]
      # jtbl_8002D5C0, func_8003E758's 28-entry table: the first of the three
      # contiguous runs, 112 bytes.
      - [0xdc0, .rodata, unk_11F0C]
  - type: code
    start: 0xe30
    vram: 0x8002D630
    align: 4
    subsegments:
      # jtbl_8002D630 and jtbl_8002D658, func_80041344's and func_80041588's.
      # The leading dot matters: `.rodata` makes splat route the subsegment to
      # the sibling C object and extract nothing, where plain `rodata` would
      # disassemble the bytes into asm/data/ and the Makefile would link them as
      # well as the C. The unit's own `.rodata` is 0x4C bytes -- 9 entries, the
      # zero word that is the second table's own `.align 3`, 9 entries -- so the
      # pad falls out of the compiler and needs no spec entry.
      - [0xe30, .rodata, unk_14934]
  - type: code
    start: 0xe7c
    vram: 0x8002D67C
    align: 4
    subsegments:
      # jtbl_8002D67C, func_80042BDC's 32-entry table: 128 bytes, the last of
      # the three contiguous runs, and the only subsegment of this segment
      # because a segment's .data all precedes its .rodata.
      - [0xe7c, .rodata, unk_154BC]
  - type: code
    start: 0xefc
    vram: 0x8002D6FC
    align: 4
    subsegments:
      - [0xefc, rodata, str_pool_EFC]
  # jtbl_8002E5F8, func_8004CECC's 6-entry table and, since that function
  # matched on 2026-11-01, the only `.rodata` of the FIRST piece of the carved
  # unit unk_1C540 -- the piece now ends at func_800517CC, which with
  # everything after it is csrc/unk_24FCC.c. 24 bytes, no pad. It needs its
  # own segment because the 0x354 bytes of Shift-JIS text that follow are
  # `bin`, which is `.data`, and a segment emits all its `.data` ahead of all
  # its `.rodata`.
  - type: code
    start: 0x1df8
    vram: 0x8002E5F8
    align: 4
    subsegments:
      - [0x1df8, .rodata, unk_1C540]
  - type: code
    start: 0x1e10
    vram: 0x8002E610
    align: 4
    subsegments:
      - [0x1e10, rodata, str_pool_1E10]
  # jtbl_8002E964, func_800517CC's 8-entry table: the only `.rodata` of
  # unk_24FCC, the sixth piece. 32 bytes, no pad -- the table's own `.align 3`
  # is relative to the object's section origin, which is offset 0 here.
  - type: code
    start: 0x2164
    vram: 0x8002E964
    align: 4
    subsegments:
      - [0x2164, .rodata, unk_24FCC]
  # The staff-credits roll, as one hand-owned listing: asrc/credits.s, placed
  # by the `hrodata` subsegment type. 53 strings, the whole of this segment,
  # replacing 53 one-per-string `shiftjis` subsegments that `azure findstr`
  # generated.
  #
  # Every one of the 53 starts 4-aligned and carries exactly `4 - (len % 4)`
  # trailing zeros -- the same 160 bytes of inter-string padding the previous
  # comment counted, now emitted by `.shiftjisz` in the listing rather than
  # absorbed by 53 subsegments. Nothing needs a `bin` filler, which is just as
  # well: a `bin` is `.data` and would be emitted ahead of this segment's whole
  # `.rodata` group.
  #
  # The strings are named in slus_006.14_symbol_addrs.txt, which matters here in
  # a way it did not for the item pool. `hrodata` scans its range, so splat
  # knows a symbol lives at each address game_data's credits table points to and
  # writes those words as symbol references; the symbol_addrs entries make them
  # the names asrc/credits.s defines, so the table reads as
  # `.word STR_CREDITS_*` instead of resolving to invented D_ names that nothing
  # would define.
  - type: code
    start: 0x2184
    vram: 0x8002E984
    align: 4
    subsegments:
      - [0x2184, hrodata, credits]
  # The run at 0x8002EFDC, supplied by TWO objects: jtbl_8002EFDC is
  # func_80052144's, in unk_25944, and jtbl_8002EFF0 is func_80052CE0's, in
  # unk_264E0. Two contiguous `.rodata` subsegments in two adjacent segments,
  # the same arrangement the three contiguous tables at 0x8002D630 use -- one
  # segment can hold only one `.rodata` group under ld_legacy_generation.
  - type: code
    start: 0x27dc
    vram: 0x8002EFDC
    align: 4
    subsegments:
      - [0x27dc, .rodata, unk_25944]
  - type: code
    start: 0x27f0
    vram: 0x8002EFF0
    align: 4
    subsegments:
      - [0x27f0, .rodata, unk_264E0]
  # The item/spell description-and-name pool, ALL of it, as one hand-owned
  # assembly listing: asrc/items.s, placed by the `hrodata` subsegment type
  # (splat/ext/hrodata.py), which seeds such a file once and then never
  # rewrites it.
  #
  # 405 strings over 0x2810-0x660C. This replaces 322
  # one-per-string `shiftjis` subsegments, which ran 0x2810-0x57F8 and ended at
  # str/item/jp_57f0, AND the `str_item_tail` blob that held the remaining 83
  # strings. Entries alternate a description with the short name it belongs to.
  # 46 of the names came from a kana/kanji byte-pair scan rather than `azure
  # findstr`, whose heuristic only takes full-width Latin: the Japanese
  # UNIDENTIFIED-item names were never translated for the US release and are
  # still in here as colour-plus-noun pairs.
  #
  # Why ONE subsegment and not 405: `subalign: 4` applies per subsegment, so
  # splitting string-by-string makes splat align every entry, and a string that
  # does not happen to start on the grid gets padded and shifts everything
  # after it. One subsegment is one literal `.rodata` run, so the question
  # never arises -- and `.shiftjisz` in the listing emits each string's NUL plus
  # its 1-4 bytes of padding, so the file carries no `.fill` and no counting.
  #
  # The comment this replaces said five of the tail's strings -- 0x57FA,
  # 0x586E, 0x596A, 0x5A62 and 0x60C6 -- START 2-aligned, and that splitting
  # them would need one extra segment each. They do not. Every one of those
  # offsets is the SECOND character of a short kanji string whose own start is
  # 4-aligned: 0x57F8 is `な玉`, 4 bytes then 4 zeros, and 0x57FA is its `玉`.
  # That is what a byte-pair scan reports when it latches onto a trailing
  # character. Measured over the whole run: 405 of 405 entries start 4-aligned
  # and carry exactly `4 - (len % 4)` trailing zeros, and the listing assembles
  # byte-identical to 0x2810-0x6614.
  - type: code
    start: 0x2810
    vram: 0x8002F010
    align: 4
    subsegments:
      - [0x2810, hrodata, items]
      # The last 8 bytes of what used to be `str_item_tail` are not text and
      # have nothing to do with the pool, so they are their own subsegment
      # rather than a byte block at the bottom of asrc/items.s: `s16
      # {1, 2, 3, 0}`, which func_80054104 memcpys into a local `s16 t[4]` and
      # then reads the first three entries of. Two more C units declare it.
      # splat names it D_80032E0C on its own, from the references.
      - [0x660c, rodata, tbl_660C]
  # unk_2879C's run, COMPLETE as of 2026-10-27: jtbl_80032E14 (36 entries),
  # jtbl_80032EA4 (23) and jtbl_80032F04 (126) -- func_80054F9C's,
  # func_80057A94's and func_80057D20's. 0x2E8 bytes: the first two are 0xEC
  # with no pad between them, then one zero word of alignment before the
  # third, which the compiler emits itself. It was cut short at 0x6700 while
  # func_80057D20 was still asm, the rest left as `bin`; when that function
  # matched, dropping the `bin` segment was the whole placement step, and the
  # build stayed byte-identical.
  - type: code
    start: 0x6614
    vram: 0x80032E14
    align: 4
    subsegments:
      - [0x6614, .rodata, unk_2879C]
  - type: code
    start: 0x68fc
    vram: 0x800330FC
    align: 4
    subsegments:
      # Sixteen bytes that are NOT this object's: "MThd"/"MTrk" headers, i.e.
      # the head of a MIDI resource that belongs to whatever unit comes next.
      # Deleting this segment along with jtbl_80032F04's `bin` leaves a hole
      # the linker fills with the following rodata, so the two have to be
      # split rather than dropped together.
      - [0x68fc, rodata, smf_magic]
  # jtbl_8003310C, func_800595C0's 58-entry table: 0xE8 bytes, and the only
  # subsegment of its segment for the same reason as the runs above. unk_1C540
  # owns FOUR tables in TWO separated runs, and a unit's `.rodata` is one
  # contiguous output section, so the carved unit is split in two at
  # func_800595C0: csrc/unk_1C540.c supplies the run above and csrc/unk_2CDC0.c
  # supplies this one. See docs/open-matching-problems.md.
  - type: code
    start: 0x690c
    vram: 0x8003310C
    align: 4
    subsegments:
      - [0x690c, .rodata, unk_2CDC0]
  - type: code
    start: 0x69f4
    vram: 0x800331F4
    align: 4
    subsegments:
      # 0x69F4-0x7130 is the PSY-Q libraries' `.rdata`, NOT `.data`. These
      # four were typed `data` until 2026-11-01, which is what made splat
      # print "symbol at vram 8003323C is a jumptable, indicating the start
      # of the rodata section _may_ be near here" on every run. The warning
      # was right. Matching each module's `.rdata` against the executable
      # with relocation masking places the whole region, zero mismatching
      # words throughout:
      #   0x69F4 libspu/SPU      (72 B)
      #   0x6A3C jtbl_8003323C + jtbl_8003325C -> S_SCA  (targets 0x8005EE34
      #          and 0x8005EEFC, file 0x325FC/0x326FC, inside S_SCA)
      #   0x6A7C jtbl_8003327C + the run at 0x6A9C -> unk_32934 (targets
      #          0x8005F278 and 0x8005F358, file 0x32A78/0x32B58)
      #   0x6AB8 libetc/VSYNC    (16 B, "VSync: timeout\n", its whole .rdata)
      #   0x6AC8 libetc/INTR     (105 B)  0x6B34 libetc/INTR_DMA (43 B)
      #   0x6B60 libcd/EVENT     (21 B, "CdInit: Init failed\n", unique match)
      #   0x6B78 libcd/SYS       (5 B, "none" -- already gCd_Str_None)
      #   0x6B80 libcd/BIOS      (592 B, 107 distinct invariant words)
      #   0x6DD0 libcd/CDREAD    (66 B)
      #   0x6E14 libcd/C_011     (21 B, "DMA STATUS ERROR %x\n", unique match)
      #   0x6E2C libgpu/PRIM     (208 B)  0x6EFC libgpu/SYS (564 B)
      # 0x6A3C, the offset the warning named, is exactly where SPU's .rdata
      # ends and the jump tables begin.
      #
      # That scan also moved the libcd/libgpu boundary. It was 0x6E44, which
      # is 24 bytes PAST the start of libgpu/PRIM's .rdata, so "tpage:
      # (%d,%d,%d,%d)" was filed under libcd. The run ends with libcd/C_011
      # at 0x6E14-0x6E29 plus three pad bytes, so the cut is 0x6E2C.
      # Each piece is named after the text subsegment that owns it. That is
      # not cosmetic: splat pairs a `rodata` subsegment to the text
      # subsegment of the same name, and a paired subsegment stops splat
      # printing "Rodata segment X may belong to the text segment Y"
      # (segtypes/common/rodata.py:34 returns early once `sibling` is set).
      # So the names below are load-bearing -- rename one and the hint
      # comes back.
      #
      # psyq/libcd/BIOS is the exception and is MEANT to stay unpaired. Our
      # libcd has one `BIOS` module and this 592-byte run is its whole
      # .rdata, but the game's SDK split BIOS's *text* into BIOS_1/2/3 plus
      # unk_34BD0 and unk_362B4 while leaving the .rdata in one run, so no
      # single text subsegment owns it. splat still prints two hints for it,
      # naming BIOS_1 and unk_34BD0; those two hints are the honest answer
      # and must not be silenced by naming the run after either one.
      - [0x69f4, rodata, psyq/libspu/SPU]
      - [0x6a3c, rodata, psyq/libspu/S_SCA]
      - [0x6a7c, rodata, psyq/libspu/unk_32934]
      - [0x6ab8, rodata, psyq/libetc/VSYNC]
      - [0x6ac8, rodata, psyq/libetc/INTR]
      - [0x6b34, rodata, psyq/libetc/INTR_DMA]
      - [0x6b60, rodata, psyq/libcd/EVENT]
      - [0x6b78, rodata, psyq/libcd/SYS]
      - [0x6b80, rodata, psyq/libcd/BIOS]
      - [0x6dd0, rodata, psyq/libcd/CDREAD]
      - [0x6e14, rodata, psyq/libcd/C_011]
      - [0x6e2c, rodata, psyq/libgpu/PRIM]
      - [0x6efc, rodata, psyq/libgpu/SYS]
      - [0x7130, asm, psyq/libsn/SNMAIN] # __SN_ENTRY_POINT / __main / __do_global_dtors  # UNVERIFIED: module exists in this SDK but could not be placed by content
      # func_80033D44 and func_80033D54 reach D_8008099C $gp-relatively while
      # func_80034EF8 and func_8003C0C8, further down the old unit, reach it
      # absolutely -- and maspsx's size record is file-scope, so they cannot
      # share a translation unit. The cut is immediately after func_80033D54.
      # The second piece keeps the name unk_72A8 (and so its asm directory,
      # its park files and its sweep rows) although it now starts at 0x7db8.
      - [0x72a8, c, gprel_72A8]
      - [0x7db8, c, unk_72A8]
      - [0x101f8, asm, main]
      # main's unreachable epilogue (0x102a8..0x102c4) belongs to main, not to
      # a C file: main ends in an infinite loop and splat split those seven
      # instructions off only because the dead code carries a label.
      - [0x102c4, c, unk_102C4]
      # The D_80080AA4.. cluster: two consecutive functions needing -G8.
      - [0x10308, c, gprel_10308]
      - [0x108f0, c, unk_108F0]
      # Three consecutive leaf functions. Name is provisional: the first two
      # are word fill/copy helpers, the third is unrelated struct setup.
      - [0x1134c, c, mem]
      - [0x113d0, c, unk_113D0]
      # First function converted to C. func_8003E12C is a 5-instruction leaf.
      - [0x1192c, c, swap]
      # Converted to C wholesale so splat emits per-function asm (which m2c
      # consumes) and INCLUDE_ASM stubs to replace one function at a time.
      # Name is the start offset until the original translation unit is known.
      - [0x11940, c, unk_11940]
      # func_8003E34C alone: it reaches D_800814D0 $gp-relatively while
      # func_8003E39C, four lines below it in the old unit, reaches the same
      # object absolutely -- and maspsx's size record is file-scope, so they
      # cannot share a translation unit. Stays at -G0; see the unit header.
      - [0x11b4c, c, gprel_11B4C]
      - [0x11b9c, c, unk_11B9C]
      # func_8003E4FC reaches D_80080AD4/DC $gp-relatively and nothing
      # absolutely at all -- the cleanest carve in the game.
      - [0x11cfc, c, gprel_11CFC]
      - [0x11f0c, c, unk_11F0C]
      # func_8003F240 defines D_800814D0 and reaches it $gp-relatively, while
      # its neighbour func_8003F270 reaches the same object absolutely -- so
      # they were separate original units. -G8 for this one alone.
      - [0x12a40, c, gprel_12A40]
      - [0x12a70, c, unk_12A70]
      # func_8003F5AC, the last function of unk_12A70: a two-way split.
      - [0x12dac, c, gprel_12DAC]
      # Carved out: these reach their globals $gp-relatively, so they must be
      # assembled with gas at -G8 while everything else uses -G0.
      - [0x12dd4, c, gprel_12DD4]
      # Starts one function later than its old 0x12de0: func_8003F5E0 moved into
      # gprel_12DD4, which it shares a $gp-relative global with.
      - [0x12dec, c, unk_12DEC]
      # Extended at both ends to take in func_800410FC and func_80041134:
      # all three reach D_800814E0 $gp-relatively, so they were one original
      # translation unit. See the header of csrc/gprel_148FC.c.
      - [0x148fc, c, gprel_148FC]
      - [0x149ac, c, unk_14934]
      # The D_800814E8 $gp cluster: four consecutive functions, their own
      # original translation unit, needing -G8.
      - [0x152e4, c, gprel_152E4]
      - [0x154bc, c, unk_154BC]
      # A $gp cluster carved out of the middle of unk_14934: these four
      # functions reach D_80081500 $gp-relatively and nothing else does, so
      # they were their own translation unit and need -G8.
      - [0x17504, c, gprel_17504]
      - [0x176b8, c, unk_176B8]
      # The D_80080AF3/AFC/B00 + D_80081508 cluster, needing -G8.
      - [0x17b7c, c, gprel_17B7C]
      - [0x1811c, c, unk_1811C]
      # The D_80081510 cluster: two consecutive functions, their own original
      # translation unit, needing -G8.
      - [0x18b40, c, gprel_18B40]
      - [0x19434, c, unk_19434]
      # The D_80081518..E / D_80081520..6 atlas-cursor cluster, likewise.
      - [0x1ab38, c, gprel_1AB38]
      - [0x1ada4, c, unk_1ADA4]
      - [0x1af14, asm, psyq/libsnd/SSGNC]
      - [0x1af38, c, unk_1AF38]
      - [0x1c520, asm, psyq/libsnd/UT_RON]
      - [0x1c540, c, unk_1C540]
      # Cut at func_800517CC, func_80052144, func_80052CE0, func_80054F9C and
      # func_800595C0, so each of the six pieces supplies one of the carved
      # unit's .rodata runs -- unk_25944 and unk_264E0 between them supply the
      # two halves of the run at 0x27dc. The first cut is the newest: it was
      # needed the moment func_8004CECC matched and the first piece owned two
      # separated runs, 0x1df8 and 0x2164.
      - [0x24fcc, c, unk_24FCC]
      - [0x25944, c, unk_25944]
      - [0x264e0, c, unk_264E0]
      - [0x2879c, c, unk_2879C]
      - [0x2cdc0, c, unk_2CDC0]
      - [0x301a8, asm, psyq/libsnd/PLAY]
      - [0x301d4, c, unk_301D4]
      - [0x30290, asm, psyq/libspu/S_INI]
      - [0x30404, asm, psyq/libspu/SPU]
      - [0x30f98, asm, psyq/libspu/S_DCB]
      - [0x30fbc, asm, psyq/libspu/S_Q]
      - [0x31038, asm, psyq/libspu/S_M_INIT]
      - [0x3108c, asm, psyq/libspu/S_SR]
      - [0x3115c, asm, psyq/libspu/S_M_UTIL]
      - [0x31268, asm, psyq/libspu/S_GR]
      - [0x31288, asm, psyq/libspu/S_SRMP]
      - [0x31780, asm, psyq/libspu/S_SRA]
      - [0x31c50, asm, psyq/libspu/S_RRWA]
      - [0x31ca0, asm, psyq/libspu/S_SRV]
      # The five `unk_*` blocks below are PSY-Q library code whose MODULE could
      # not be named, though the LIBRARY now can be. Each is 100% plausible
      # MIPS with a real prologue; `azure libscan psyq` names none of them at
      # any --min-invariant, down to 2, because the module is not in the
      # PSY-Q 4.0 libraries this project ships. The same gap shows up in the
      # data region, where libspu/S_INI's .data matches at 0x4CCEC except for
      # the 8 bytes that should be the libspu stamp -- so the game linked a
      # libspu (and libcd) build we do not have a copy of.
      #
      # They are `asm` rather than `bin` because they are code, which is also
      # what keeps splat from reporting them as unknown.
      #
      # The library assignment is not from link position alone. Each block was
      # checked against the data it reaches, and in every case that data is

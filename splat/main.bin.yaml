  # and a different version of the compiler.
  - type: code
    start: 0x269000
    vram: 0x80400000
    subsegments:
      - [0x269000, .rodata, main/debug/c_server_a]
      - [0x269090, .rodata, main/debug/c_server_b]
      - [0x269548, .rodata, main/debug/card_mes]
      - [0x2695a0, .rodata, main/debug/card_opt]
      - [0x2695f8, .rodata, main/debug/card_win]
      - [0x26962c, .rodata, main/debug/cardbk]
      - [0x269738, .rodata, main/debug/cardinfo]
      - [0x2697a4, .rodata, main/debug/cardslot]
      - [0x2697d8, .rodata, main/debug/cardsme]
      - [0x26986c, .rodata, main/debug/memory]
      - [0x2698a0, c, main/debug/c_server_a]
      - [0x26a7ec, c, main/debug/c_server_b]
      - [0x26b508, c, main/debug/card_mes]
      - [0x26c4d8, c, main/debug/card_opt]
      - [0x26cda0, c, main/debug/card_win]
      - [0x26d6c8, c, main/debug/cardbk]
      - [0x26dea0, c, main/debug/cardinfo]
      - [0x26f9fc, c, main/debug/cardslot]
      - [0x27089c, c, main/debug/cardsme]
      - [0x2711ac, c, main/debug/memory]
      - [0x27155c, c, ovl_main_80400000]
      # NB: The debug overlay has its own subset of PSY-Q statically linked
      # here.
      - [0x271644, asm, main/debug/psyq/libcard/A92]    # _card_status
      - [0x271654, asm, main/debug/psyq/libcard/A93]    # _card_wait
      - [0x271664, asm, main/debug/psyq/libcard/C171]   # _card_info
      - [0x271674, asm, main/debug/psyq/libcard/C172]   # _card_load
      - [0x271684, asm, main/debug/psyq/libcard/CARD]   # _card_clear
      - [0x2716bc, asm, main/debug/psyq/libcard/A78]    # _card_write
      - [0x2716cc, asm, main/debug/psyq/libcard/A80]    # _new_card
      - [0x2716dc, asm, main/debug/psyq/libcard/INIT]   # InitCARD, StartCARD, StopCARD
      - [0x271798, asm, main/debug/psyq/libcard/A74]    # InitCARD2
      - [0x2717a8, asm, main/debug/psyq/libcard/A75]    # StartCARD2
      - [0x2717b8, asm, main/debug/psyq/libcard/A76]    # StopCARD2
      - [0x2717c8, asm, main/debug/psyq/libcard/END]    # _ExitCard
      # Five functions with no module identified and no resident counterpart:
      # a `jr` into a data label, the two BIOS-table patchers INIT calls
      # (GetC0Table at B0:0x56 and GetB0Table at B0:0x57, each stashing $ra at
      # D_8040923C), and two delay loops. None is expressible in C.
      - [0x271848, asm, main/debug/psyq/unk_271848]
      - [0x2719e0, .data, ovl_main_80400000]
      - [0x275628, pad]
  - [0x275800]

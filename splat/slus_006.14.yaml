      # 0x3E01C-0x541D0 was one 90 KB `bin` blob described as game data. It is
      # not: its last third is PSY-Q library `.data`, and every boundary below
      # is byte-verified rather than inferred. Two independent methods agree.
      #
      # (1) The library stamp. Every PSY-Q library carries exactly one 8-byte
      #     record `50 73 <id> 15 9C <ck> 40 00` -- ASCII "Ps" plus a library
      #     id -- at offset 0 of one designated module's section. All 18
      #     libraries in psyq/lib carry one, so the id is a lookup table:
      #     00 libapi/C114, 01 libc/A63, 02 libc2/PUTS, 03 libcard/INIT,
      #     04 libcd/BIOS, 05 libcomb/COMB, 06 libetc/VSYNC, 07 libgpu/SYS,
      #     08 libgs/GS_001, 09 libgte/MSC00, 0A libgun/GUN, 0B libmath/FERR,
      #     0E libpress, 0F libsio/SIO, 10 libsnd/SSINIT, 11 libspu/S_INI,
      #     14 libtap/TAP, 18 libmcrd. Seven occur in this executable, and
      #     because the stamp is at section offset 0 each one marks a section
      #     start exactly: 0x4D4B8 (06, libetc), 0x4E6A8 (04, libcd),
      #     0x53F74 (07, libgpu), 0x540E4 (03, libcard), plus 0x37E80,
      #     0x3D608 and 0x3D7C4 in .text, which confirm the libgte/MSC00,
      #     libc/A63 and libapi/C114 placements already in this file.
      # (2) Relocation-masked content match of each library module's `.data`
      #     against the executable -- the same method `azure libscan` uses for
      #     `.text`, which only scans `.text`. Modules placed exactly, with
      #     zero mismatching words:
      #       0x4CCEC libspu/S_INI -- our copy's .data is 1140 B and matches
      #               here with 8 mismatching words, but S_INI.data[8:]
      #               matches with ZERO mismatches over 1132 B, and the 8
      #               bytes dropped are exactly the library stamp. The game
      #               linked an S_INI built without it, which is also why no
      #               libspu stamp occurs anywhere in the file, and why SPU's
      #               .data below lands contiguously rather than overlapping.
      #               Every S_INI export offset therefore shifts down by 8 --
      #               that is where the _spu_* names in the symbol_addrs file
      #               come from. Same story the five unk_* blocks tell.
      #       0x4D158 libspu/SPU      0x4D1C0 libspu/S_RMP (760 B, 122 distinct invariant words)
      #       0x4D4B8 libetc/VSYNC    0x4D4D0 libetc/INTR  (4340 B)
      #       0x4E618 libcd CD-register table (16 B, shared by every C_0xx)
      #       0x4E6A8 libcd/BIOS (792 B, 152 distinct invariant words)  0x4EA7C libcd/C_011
      #       0x4EACC libgte/SINCOS (2050 B, 504 distinct invariant words)
      #       0x4F2E0 libgte/SQRTBL  0x4F460 libgte/MTX_006
      #       0x4F770 libgte/CSTBL (16384 B, 4092 distinct invariant words)
      #       0x53770 libgte/RATAN (2050 B, 513 distinct invariant words)
      #       0x53F74 libgpu/SYS (368 B)   0x540E4 libcard/INIT (8 B: the
      #               stamp is the whole section)
      #       0x540EC libc/CTYPE0 (129 B, the ctype class table)
      #       0x54170 libapi/COUNTER (24 B)
      # The subsegments below are cut at library granularity; the module list
      # above is the finer map. Every boundary is a multiple of 4, which
      # `subalign: 4` requires -- see docs/data-map.md.
      #
      # SNMAIN is the first object in link order, so its .data is the first
      # .data. All 36 bytes of it match our libsn copy exactly, and SNMAIN
      # exports a name for every word, so this is the SN module descriptor
      # read out in full -- an authoritative statement of the image layout
      # that happens to sit inside the binary:
      #   __heapbase 0  __heapsize 0
      #   __text  0x80033930  __textlen 0x36EEC -> ends 0x8006A81C
      #   __data  0x8006A81C  __datalen 0x16178 -> ends 0x80080994
      #   __bss   0x800815C0  __bsslen  0x71A0  -> ends 0x80088760
      # It self-validates twice over: __text + __textlen is exactly __data,
      # and __data + __datalen is exactly _gp (the `gp_value` above, derived
      # independently from $gp-relative code). It also pins .bss, which is
      # not otherwise visible: 0x800815C0-0x80088760. The image ends at
      # 0x80081800, so the file carries the first 0x240 bytes of .bss as
      # zeros -- which is why the last non-zero byte of the image is 0x54C35
      # (vram 0x80081435), just below __bss. __main zeroes the rest.
      #
      # unk_72A8.c reaches a game s16 array at 0x8006A83E, i.e. inside
      # __bsslen's upper half; that is a biased base from the original C, not
      # a separate object, and 0x3E03E is not 4-aligned anyway. The cut goes
      # at 0x3E040, where SNMAIN's section genuinely ends.
      - [0x3e01c, data, psyq/libsn_data]
      # 59 KB of genuine game data: pointer/descriptor tables, three packed
      # Shift-JIS dialogue pools, and a large run of fixed-size records with
      # its own directory. Still one blob -- its internal boundaries are real
      # but not yet pinned to the byte, so they live in docs/data-map.md
      # rather than being guessed at here.
      - [0x3e040, data, game_data]
      - [0x4ccec, data, psyq/libspu_data]
      - [0x4d4b8, data, psyq/libetc_data]
      - [0x4e618, data, psyq/libcd_data]
      # The three libgte tables worth knowing, all verified numerically:
      #   0x4EACC SINCOS -- 1025 u16 = round(4096*sin(i*pi/2048)) for
      #           i in 0..1024, max error 0, then 7 entries clamped to 4096 so
      #           a lookup may overshoot. GEO_00/GEO_01 reach it through bases
      #           biased by -0x800/-0x1000/-0x1800 to pick a quadrant, which
      #           is why splat invents symbols at 0x4D2CC, 0x4DACC and 0x4E2CC
      #           inside the libspu and libetc runs. Those are aliases of this
      #           table, not objects.
      #   0x4F2E0 SQRTBL -- 192 u16, 4096..8175 (one octave of mantissa).
      #   0x53770 RATAN  -- 1025 u16, 0..512. Not a sine and not a ramp; the
      #           arctangent table RATAN.s indexes.
      - [0x4eacc, data, psyq/libgte_data]
      - [0x53f74, data, psyq/libgpu_data]
      - [0x540e4, data, psyq/libcard_data]
      - [0x540ec, data, psyq/libc_data]
      - [0x54170, data, psyq/libapi_data]
      # Back to the game: the $gp anchor region. _gp = 0x80080994 is file
      # 0x54194, the first word of this piece.
      - [0x54194, data, game_gp]
      # The whole name table as one hand-owned listing: asrc/names.s, placed by
      # the `hrodata` subsegment type. Nineteen names over 0x541D0-0x5426C,
      # replacing six one-per-string `shiftjis` subsegments and the `data` one
      # that held the pointer between them.
      #
      # That pointer is why this looked like it needed splitting. It is four
      # bytes at 0x54250 holding 0x8002D34C -- "Girl", an entry in the separate
      # character-name table inside str_pool_800 -- and it sits between name
      # sixteen and name seventeen. As a `data` subsegment it was `.data` wedged
      # into a `.rodata` run, which the ld script emitted in declared order
      # (see the long note at the top of this file); in the listing it is simply
      # a `.word` in .rodata, and the bytes do not care which section they were
      # declared from. csrc/unk_72A8.c names it D_80080A50 and asrc/names.s
      # defines it, so the symbol survives the move.
      - [0x541d0, hrodata, names]
      # Small data above _gp: .sdata and .sbss, then zero fill. NOT the
      # game's alone, which is why this is `gp_data` and not `game_gp_data`
      # -- libapi/PATCH's 16-byte .sbss is in here, and PATCH both loads from
      # and stores to 0x80081598 (asm/psyq/libapi/PATCH.s:13 and :44).
      #
      # KNOWN FALSE POSITIVE, do not act on it. Every `splat split` prints
      #
      #   Data segment gp_data, symbol at vram 80081598 is a jumptable,
      #   indicating the start of the rodata section _may_ be near here.
      #         - [0x54D98, rodata]
      #
      # 0x80081598 is a RAM pointer slot, zero in the file, that PATCH writes
      # at run time; spimdisasm classifies it as a jumptable because code
      # loads from it and jumps through it. .rodata does not start there --
      # 0x54D98 is past __data's end (_gp, 0x54194) and just below __bss
      # (0x800815C0 / file 0x54DC0), so it is .sbss. Adding the suggested
      # subsegment would be wrong. It cannot be suppressed without
      # `suggestion_rodata_section_start: False`, which would also silence
      # the check over game_data, so it is left to print.
      - [0x5426c, data, gp_data]
      # NOT PART OF THE EXECUTABLE. The PS-X EXE header gives t_addr
      # 0x8002D000 and t_size 0x54800, so the loaded image is file
      # 0x800-0x55000 / vram 0x8002D000-0x80081800 and the PSX loader never
      # reads past it. These 176128 bytes (0x2B000, 33.6% of the 512 KB file)
      # are mastering slack, not data: high-entropy content (~7.8 bits/byte,
      # 0.3% zero) that no instruction can reach. The transition is exact to
      # the byte -- the image's last non-zero byte is 0x54C35 and
      # 0x54C36-0x55000 is zero padding, then 0x55000 is non-zero immediately.
      # Tested and rejected: SPU-ADPCM (the 16-byte block flag byte is <=7 in
      # 3.0% of blocks against a 3.1% random baseline) and VAB/SEQ/VAG/TIM
      # headers (no magic anywhere in the file).
      #
      # It is split off so the rest of this segment can be accounted for. One
      # knock-on worth knowing: a `bin` subsegment lands in the `.data` group,
      # so these bytes push the ld script's `_69F4_BSS_START` 176 KB above the
      # real .bss (whose referenced addresses start at 0x80081E90). That is
      # cosmetic -- .bss contributes no bytes and its symbols come from
      # undefined_syms_auto as absolute addresses -- but it is why the bss
      # region of the map file looks wrong.
      - [0x55000, bin, tail_unloaded]

  - [0x80000]

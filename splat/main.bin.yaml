name: main.bin
sha1: 69f63236b7ab2260e2e9aa2048ce7aa540bdbe6d
options:
  basename: main.bin
  target_path: data/main/main.bin
  base_path: ..
  platform: psx
  compiler: GCC
  extensions_path: splat/ext

  create_asm_dependencies: False

  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_dependencies: False
  # TODO: We may be able to turn this off once more of the binary is mapped
  ld_legacy_generation: True
  ld_script_path: build/main.bin.ld

  subalign: 4

  find_file_boundaries: False
  gp_value: 0x80080994

  o_as_suffix: True
  use_legacy_include_asm: False

  asset_path: assets/main
  src_path: csrc

  symbol_addrs_path: splat/main.bin_symbol_addrs.txt
  reloc_addrs_path: splat/main.bin_reloc_addrs.txt

  undefined_funcs_auto_path: splat/main.bin_undefined_funcs_auto.txt
  undefined_syms_auto_path: splat/main.bin_undefined_syms_auto.txt
segments:
  - [0x0, bin, song1.kdt]
  - [0x3000, bin, snd_bank.vh]
  - [0x4020, pad]
  - [0x4800, bin, snd_bank.vb]
  - [0x1faf0, pad]
  - [0x20000, bin, kewne_loading_img]
  - type: hrodata
    start: 0x20800
    vram: 0x8002C000
    name: str/monsters
  - type: code
    start: 0x21268
    vram: 0x8002CA68
    align: 4
    subsegments:
      - [0x21268, .rodata, main_tables_21268]
  - [0x21768, pad]
  # The GAME OPTION overlay, loaded to 0x80088760 by the CD queue descriptor
  # at vram 0x80080C38.
  - type: code
    start: 0x21800
    vram: 0x80088760
    subsegments:
      - [0x21800, .rodata, ovl_main_80088760]
      - [0x21830, .rodata, ovl_main_80089608]
      - [0x21894, hrodata, str/options]
      - [0x2194c, .rodata, ovl_main_8008A288]
      - [0x21968, c, ovl_main_80088760]
      - [0x226a8, c, ovl_main_80089608]
      - [0x23328, c, ovl_main_8008A288]
      - [0x24114, data, ovl_main_80088760_data]
  - [0x24420, pad]
  # NB: 2 MB of mastered random filler. (?)
  - [0x28420, bin, unread_filler]
  - [0x221800, bin, unk_img_1]
  - [0x226800, bin, title_bg_img]
  - [0x257000, bin, title_menu_img]
  - [0x258800, bin, unk_img_2]
  # The 0x80020000 card overlay, owned in full by csrc/main/*.c plus
  # csrc/ovl_main_80020000.c
  - type: code
    start: 0x25d000
    vram: 0x80020000
    subsegments:
      - [0x25d000, .rodata, main/c_server]
      - [0x25d0a0, .rodata, main/card_mes]
      - [0x25d0a4, .rodata, main/cardbk]
      - [0x25d0a8, .rodata, main/cardinfo]
      - [0x25d0c0, .rodata, main/memory]
      - [0x25d924, c, main/c_server]
      - [0x25f25c, c, main/card_mes]
      - [0x260258, c, main/card_opt]
      - [0x260a78, c, main/card_win]
      - [0x2612d8, c, main/cardbk]
      - [0x261390, c, main/cardinfo]
      - [0x2631c0, c, main/cardslot]
      - [0x264018, c, main/cardsme]
      - [0x26489c, c, main/memory]
      - [0x264e20, .data, main/c_server]
      - [0x264f60, .data, main/card_mes]
      - [0x264f68, .data, main/card_opt]
      - [0x264f7c, .data, main/card_win]
      - [0x264fd0, .data, main/cardbk]
      - [0x264fd4, .data, main/cardinfo]
      - [0x265068, .data, main/cardslot]
      - [0x265094, .data, main/cardsme]
      - [0x2650b4, .data, main/memory]
      - [0x265530, .data, ovl_main_80020000]
      - [0x268b6c, pad]
  # The 0x80400000 debug twin of the overlay above. Requires -G8 in the build
  # and a different version of the compiler.
  - type: code
    start: 0x269000
    vram: 0x80400000
    subsegments:
      # DOTTED vs UNDOTTED here is forced, in both directions. jtbl_8040007C's
      # entries are `.L` labels inside func_804016D0, and a local label is
      # only visible in its own object, so that table must ride with the code:
      # dotted. The 0x7C in front of it must NOT migrate -- migration only
      # emits a symbol it can attribute to ONE function, and c_server.c's
      # ASSERT_FMT copy is referenced from dozens, so splat attributes it to
      # nobody and writes it nowhere, and the link fails on undefined
      # D_80400004. Undotted needs a DIFFERENT name: an undotted subsegment
      # sharing the `c` unit's name is a hard error.
      #
      # 0x269000 IS ONE WINDOW, NOT TWO, and that took a build change. gcc
      # gives every jump table `.align 3` (final.c:1518, BIGGEST_ALIGNMENT
      # 64), so jtbl_8040007C at offset 0x7C of the unit's own `.rodata` --
      # 4 mod 8 -- used to cost four bytes of gas pad, measured as `.rodata`
      # 148 against the window's 144 and `size differs by +0x4`. The block
      # then needed a THIRD unit whose section started at the table. It does
      # not any more: tools/decomp/jtbl_align.py rewrites that one directive
      # to `.align 2` for this unit only, because this is the 4.0-SDK block
      # and a toolchain that 8-aligned jump tables could not have put one at
      # 0x8040007C in the first place. The 4.1 units keep their pad -- see the
      # filter's header for the live-overlay measurement that proves it.
      #
      # TWO DOTTED `.rodata` WINDOWS REMAIN, AND THEY MUST BE TWO UNITS. The
      # 0x810 bytes at 0x269090 are csrc/ovl_main_80400000_rodata.c -- 98
      # objects, where splat's old `rodata_post` listing had 47 labels -- and
      # they cannot be part of the unit above them, in any file order: at -G8
      # cc1psx writes the TEXT to a temp file and appends it after all
      # file-scope data (mips.c:4181, for the assembler's small-data pass), so
      # jtbl_8040007C always lands AFTER every object the unit defines.
      # Measured: the right total, 2084, and main.bin differing from
      # 0x26907c, the table's own address. A unit gets one subsegment per
      # section, so one unit cannot hold two windows either. This split is
      # the one the eventual nine-translation-unit shape dissolves on its own:
      # that 0x810 is the OTHER EIGHT units' rodata, eight more ASSERT_FMT
      # copies among it, and 0x269090 is simply where c_server.c ends.
      # See csrc/ovl_main_80400000_rodata.c's header and
      # docs/owning-data.md SS6 and SS9.3.
      - [0x269000, .rodata, ovl_main_80400000]
      - [0x269090, .rodata, ovl_main_80400000_rodata]
      - [0x2698a0, c, ovl_main_80400000]
      # Dotted `.data`, so splat emits NOTHING here and csrc/ovl_main_80400000.c
      # defines all 0x3C48 bytes itself -- 98 objects, 89.8% of them zero. The
      # window ends where `pad` begins, so no boundary moves when it grows; see
      # docs/owning-data.md, and SS9 for the two -G8 rules this block needs.
      - [0x2719e0, .data, ovl_main_80400000]
      - [0x275628, pad]
  - [0x275800]

[project]
name = "azure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pillow>=11.2.1,<12.0.0",
    "pydantic>=2.10.4,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "splat64[mips]>=0.32.2,<1.0.0",
    # vendor/decomp-permuter imports toml; without it permuter.py dies at import
    # and permrun.py reports `base=?', which reads as a broken park rather than
    # a missing dependency. It was only ever satisfied by the system python.
    "toml>=0.10.2,<1.0.0",
]

[project.scripts]
azure = "azure.main:main"
extract = "extract:main"

[build-system]
requires = ["uv-build<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = []

[dependency-groups]
dev = [
    "mcp[cli]>=2.3.0",
    "tree-sitter>=0.27.0",
    "tree-sitter-c>=0.24.2",
]

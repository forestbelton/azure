# Every file in az.bin's ISO9660 filesystem, in disc order.
#
# az.bin is a raw MODE2/2352 image: 126,946 sectors, all mode 2, and the files
# cover it contiguously from lba 23 to lba 126,795.  The only sectors no file
# owns are the system area (0..15), the volume descriptors (16..17), the path
# tables (18..21), the root directory (22), the five directory records, and 150
# blank sectors of post-gap at the tail.  There is nothing hidden outside the
# filesystem.
#
# Each entry gives its position as `sector` (the first lba) and `sectors` (the
# extent).  The extent is in sectors rather than bytes because a byte length
# cannot be turned back into a sector count: FORM1 sectors carry 2048 bytes of
# user data and FORM2 sectors 2324, so for an interleaved stream the length
# depends on the mix.  Extraction keeps every payload byte of every sector.
#
# `size` is optional and means "truncate to this many bytes".  Only a file
# whose real content ends mid-sector needs it, which here is system.cnf alone.
# It is not a way to drop the sector-aligned filler the mastering left in the
# .BIN containers: that filler also sits in the *middle* of them, not just at
# the tail, so the containers are taken as presented.
#
# `type` is descriptive -- extraction does not branch on it -- and selects
# files for `azure spec --only`:
#
#   data         Plain MODE2/FORM1.  Every sector carries 2048 bytes.
#   audio-video  A CD-XA stream: MDEC video in FORM1 sectors interleaved 7:1
#                with XA-ADPCM audio in FORM2 sectors.
#   audio        A CD-XA stream with no video sectors at all -- XA-ADPCM audio
#                padded out with blank FORM1 sectors to pace the drive.
infile: az.bin
shasum: fab68454be5e4e48f7a43ac797cc8c47325c6a20

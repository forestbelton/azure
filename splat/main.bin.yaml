name: main.bin
sha1: 69f63236b7ab2260e2e9aa2048ce7aa540bdbe6d
options:
  basename: main.bin
  target_path: data/main/main.bin
  base_path: ..
  platform: psx
  compiler: GCC
  extensions_path: splat/ext

  create_asm_dependencies: False

  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_dependencies: False
  # TODO: We may be able to turn this off once more of the binary is mapped
  ld_legacy_generation: True
  ld_script_path: build/main.bin.ld

  subalign: 4


  find_file_boundaries: False
  gp_value: 0x80080994

  o_as_suffix: True
  use_legacy_include_asm: False

  asset_path: assets/main
  src_path: csrc

  symbol_addrs_path: splat/main.bin_symbol_addrs.txt
  reloc_addrs_path: splat/main.bin_reloc_addrs.txt

  undefined_funcs_auto_path: splat/main.bin_undefined_funcs_auto.txt
  undefined_syms_auto_path: splat/main.bin_undefined_syms_auto.txt
segments:
  - [0x0, bin, song1.kdt]
  - [0x3000, bin, unk.vab]
  - [0x3800, bin]
  - [0x20000, bin, kewne_loading_img]
  - start: 0x20800
    type: hrodata
    name: str/monsters
    # NB: `vram: 0x20800` is just the ROM offset, not its actual load address
    vram: 0x20800
  # Pointer and index tables, then 11 KB of unidentified fixed-size records,
  # then zero padding from 0x24440. The game reads this: the CD-ROM command
  # log seeks main.bin+0x20800 and +0x21800. 144 of its words are pointers
  # into 0x8002c094..0x8008b270, i.e. into the resident executable's own RAM,
  # so it is a relocated resource rather than a standalone file.
  #
  # It starts at 0x21268 and not 0x21280: the string pool's last entry is
  # "Ｕｌｔｉｍａｔｅ", whose NUL is at 0x21264, and the 20-byte records whose
  # stride runs 0x2127C, 0x21290, 0x212A4, ... leave 0x21268..0x2127C as one
  # more 20-byte unit ahead of them. Whether that unit is a record or a header
  # is not settled -- its first word is 0x00240010 against the records'
  # 0x000C0110/0x000C0010, and its second is not a pointer -- but it is table
  # words either way, and not text.
  - [0x21268, bin, main_tables_21268]
  # DEAD FILLER, 2,069,472 bytes (0x1F93E0) -- the single largest unmapped run
  # in any container, and it holds nothing. It is kept as a named `bin` for the
  # same reason as slus_006.14's `tail_unloaded`: so splat stops calling it
  # unknown and nobody spends another pass on it.
  #
  # The game never reads it. A PCSX-Redux CD-ROM command log covering boot,
  # title, town and dungeon (78 distinct seeks) hits main.bin at exactly 11
  # offsets -- +0x0, +0x3000, +0x4800, +0x20000, +0x20800, +0x21800, then
  # straight to +0x221800, +0x226800, +0x257000, +0x258800, +0x25d000. The one
  # gap in that list is this run, to the sector. There is also no resource
  # table to reach it with: neither slus_006.14 nor main.bin contains the
  # sector numbers (67, 1091, 1101, 1198, 1201, 1210) or the byte offsets
  # (0x221800, 0x226800, 0x257000, 0x258800, 0x25d000) of the known resources
  # as a u16 or u32 table anywhere.
  #
  # It is nevertheless real, deliberately mastered content, not a dump
  # artifact: all 1011 of its CD sectors (LBA 1897..2907) carry a VALID EDC
  # over bytes 16..2071, checked against the Mode 2 Form 1 layout and
  # validated on known-good sectors first.
  #
  # What it is NOT, each tested rather than assumed:
  #   - not compressed game data -- it is incompressible. zlib -9 returns
  #     100.03% of input and xz 100.02%; both expand it.
  #   - not any PRNG fill. Berlekamp-Massey over its bits gives linear
  #     complexity exactly n/2+1 (1001 at 2000 bits, 10001 at 20000), the
  #     random signature, so no LFSR generated it; and solving
  #     x[n+1] = a*x[n] + c mod 2^32 from three consecutive words predicts
  #     2 of 4095 at every alignment and endianness tried, so no word LCG did.
  #   - not SPU-ADPCM and not XA-ADPCM. The 16-byte-block test scores 0.2543 /
  #     0.0324 against a random baseline of 0.254 / 0.031 at every phase, and
  #     0 of 16167 128-byte groups show the XA sound-group header redundancy.
  #   - not images -- no TIM header occurs in it at any 4-aligned offset.
  #   - not a copy of anything else on the disc. Six 24-byte needles taken
  #     across it each occur exactly ONCE in all 298 MB of az.bin: here.
  #   - not the disc's own padding convention. /STR/DUMMY_.STR and
  #     /STRT/DUMMYM.STR are 99.6% zeros (16 bytes of 0x0c, then zero fill,
  #     one sector repeated 166 times); this is nothing like them.
  #   - not a file-wide pre-fill either. Every OTHER gap in main.bin is zeros
  #     (0x24440..0x28420, 0x265000, 0x2719e0 all 90-99.9% zero), so only this
  #     one run was filled this way.
  #
  # What it measures as: 2,069,472 bytes at H = 7.9999 bits/byte, chi-square
  # 218.5 on 255 df, zero fraction 0.00392 = 1/256, longest zero run in the
  # whole 2 MB just 2 bytes, and 0 anomalous windows out of 16167 scanned at
  # 128-byte resolution. That is indistinguishable from uniform random, and it
  # is the SAME fingerprint as slus_006.14's `tail_unloaded` (176,128 bytes,
  # H = 7.9989, chi-square 268.7, zero fraction 0.00374), which docs/data-map.md
  # reached the same dead end on. Two regions, one explanation.
  #
  # The one structural fact worth recording: it ends at 0x221800, and
  # 0x221800 - 0x21800 = exactly 0x200000. Read with the segment above, the
  # resource the game loads at +0x21800 sits at the head of a round 2 MiB
  # reservation whose unwritten remainder is this run. That makes it a
  # reserved hole keeping the images at +0x221800 and beyond on fixed sector
  # offsets -- which is why it must still be reproduced byte for byte by
  # `make containers` even though nothing reads it.
  #
  # Do not spend time on it.
  - [0x28420, bin, unread_filler]
  - [0x221800, bin, unk_img_1]
  - [0x226800, bin, title_bg_img]
  - [0x257000, bin, title_menu_img]
  - [0x258800, bin, unk_img_2]
  # The 0x80020000 overlay. docs/overlays.md is how the block was placed and
  # what it is; docs/owning-data.md is the shape below -- both dotted
  # subsegments are defined in full by csrc/ovl_main_80020000.c, splat writes
  # not a byte of either, and `_pad` is what keeps this segment's end on the
  # 16-byte grid `__romPos` needs.
  - type: code
    start: 0x25d000
    vram: 0x80020000
    subsegments:
      # THE NINE UNITS, carved out 2026-11-10 into csrc/main/. Text runs are
      # live-block function indices; docs/overlays.md's "Carving the nine" has
      # the evidence for each boundary and says which are inferences. Only
      # five units own rodata, in link order -- card_opt/card_win/cardslot/
      # cardsme emit none, and memory.c owns the 59 message strings because
      # the eight tables that reference them are its .data.
      #
      # THE DATA IS CARVED TOO, as each unit's own .data. What is left in
      # ovl_main_80020000.c is only the state run, 0x80028530..0x8002BB6C,
      # the overlay's .bss, which cannot be .bss and cannot go with the
      # units: every explicit `.data` subsegment sits above all text, so the
      # nine auto-emitted main/*.o(.data) lines always come FIRST in the DATA
      # group, and a unit can therefore only own the FIRST of the image's two
      # runs. See docs/overlays.md, "The data IS carved".
      - [0x25d000, .rodata, main/c_server]       # 0x80020000, 0xA0
      - [0x25d0a0, .rodata, main/card_mes]       # 0x800200A0, 4
      - [0x25d0a4, .rodata, main/cardbk]         # 0x800200A4, 4
      - [0x25d0a8, .rodata, main/cardinfo]       # 0x800200A8, 0x18
      - [0x25d0c0, .rodata, main/memory]         # the 59 message strings
      - [0x25d924, c, main/c_server]             #   0..45
      - [0x25f25c, c, main/card_mes]             #  46..87
      - [0x260258, c, main/card_opt]             #  88..102
      - [0x260a78, c, main/card_win]             # 103..121
      - [0x2612d8, c, main/cardbk]               # 122
      - [0x261390, c, main/cardinfo]             # 123..171
      - [0x2631c0, c, main/cardslot]             # 172..205
      - [0x264018, c, main/cardsme]              # 206..227
      - [0x26489c, c, main/memory]               # 228..240
      # The first data run, per unit. These are redundant for the LINK -- a `c`
      # subsegment already emits its object's `.data` line, and splat keeps
      # the first occurrence -- but they are not redundant for COVERAGE: with
      # the range unclaimed, splat reads it as unmapped and writes 41 of its
      # symbols into main.bin_undefined_syms_auto.txt as absolute addresses,
      # shadowing the real definitions. They also document the partition.
      - [0x264e20, .data, main/c_server]          # 0x80027E20
      - [0x264f60, .data, main/card_mes]          # 0x80027F60
      - [0x264f68, .data, main/card_opt]          # 0x80027F68
      - [0x264f7c, .data, main/card_win]          # 0x80027F7C
      - [0x264fd0, .data, main/cardbk]            # 0x80027FD0
      - [0x264fd4, .data, main/cardinfo]          # 0x80027FD4
      - [0x265068, .data, main/cardslot]          # 0x80028068
      - [0x265094, .data, main/cardsme]           # 0x80028094
      - [0x2650b4, .data, main/memory]            # 0x800280B4, the inferred one
      - [0x265530, .data, ovl_main_80020000]      # the state run only
      - [0x268b6c, data, ovl_main_80020000_pad]
  # The second code run, RESOLVED 2026-11-01 to 0x80400000. An earlier pass
  # left it as bin, reporting "only 58 internal jal targets and the best
  # delta scored 6 against a floor of 5, which is noise" -- that measurement
  # was wrong, not the method. Voting this block's own `jal` targets against
  # its own `addiu sp,sp,-N` prologues over the full +0x269000..+0x272000
  # span gives 654 jal sites to 265 distinct targets, 191 prologues, and
  # **142 hits at this delta against a next-best of 33** -- the same
  # second-vote test that placed the other three overlays.
  #
  # Four independent confirmations, so the vote is not carrying this alone:
  #
  # 1. The function-pointer table at +0x269058 holds 0x804010F0, 0x804013D0,
  #    0x804013A8, 0x804012B0, and the last two ARE prologues at the
  #    predicted file offsets (0x26A2B0, 0x26A22C: `addiu $sp, $sp, -0x20`
  #    and `-0x18`).
  # 2. The code builds its addresses as `lui $at, 0x8041`, e.g.
  #    `lui $at, 0x8041; sw $v0, -0x6B14($at)` -> 0x804094EC, which lands in
  #    this block's own data.
  # 3. Text ends at 0x2719dc and the `.data` immediately after it is
  #    pointers 0x80409140 / 0x8040914C / 0x80409158 / 0x80409164.
  # 4. 0x80400000 is upper RAM on an 8 MB DTL-H2000 development board, which
  #    is why nothing loads it on retail and why the CD-ROM command log shows
  #    no seek here. It is DEAD CODE on the shipped disc -- but it is in the
  #    container, so `make containers` still has to reproduce it.
  #
  # What it is: a DEBUG BUILD OF THE SAME SOURCE as the 0x80020000 overlay
  # above, with asserts compiled in. 50.4% of the live overlay's 7487 words
  # are covered by shared masked instruction runs with this block, the
  # longest 121 words, and the function pointers correspond one-to-one with a
  # small shift from the assert calls (0x800210F0 -> 0x804010F0,
  # 0x80021298 -> 0x804012B0). That makes this block an oracle for the live
  # overlay rather than just more work: its rodata carries nine translation
  # unit names from the original source -- c_server.c, card_mes.c,
  # card_opt.c, card_win.c, cardbk.c, cardinfo.c, cardslot.c, cardsme.c and
  # memory.c -- against the live overlay's one, plus a `__LINE__` immediate
  # at every assert site and the assert EXPRESSIONS, which leak real
  # identifiers (`card_first_flg`, `(int)gsw->check_sum`).
  #
  # Boundaries. rodata is 0x269000..0x2698a0: the last string is "memory.c"
  # at 0x269894 and 0x2698a0 is the first prologue. Text END IS 0x2719e0,
  # NOT 0x2719dc: the last `jr $ra` is at 0x2719d4 and its delay slot at
  # 0x2719d8, so the code proper stops at 0x2719dc, but splat emits
  # `__romPos = ALIGN(__romPos, 16)` after a code segment and 0x2719dc is off
  # that grid -- a boundary there pads the container. 0x2719e0 takes one word
  # of the three zero words of padding into .text and is 16-byte aligned.
  # The block's data starts at 0x2719e8.
  # DECOMPILING THE TWIN. The text subsegment is `c` as of 2026-11-09, and the
  # unit is built at -G8 -- the opposite of the live overlay's -G0 override, and
  # the thing that makes the shared source produce this block. The Makefile has
  # an exact-target override for it, because the `build/csrc/ovl_%.o` pattern
  # rule would otherwise hand it -G0 like every other overlay unit.
  #
  # The plan is ONE SOURCE for both blocks, not a second decompilation: the
  # live overlay's own source rebuilt at -G8 already reproduces 86 of this
  # block's 263 functions instruction-for-instruction, 231 of 263 pair 1:1
  # with a function it already defines, and the 32 that do not are engine code
  # this debug build linked statically (`memory.c` and the PSY-Q stubs) which
  # is already decompiled in the resident units. What is missing is the
  # asserts, which `tools/assertmap.py` reads straight out of this block.
  #
  # Two things make the twin's object DIFFERENT from the live one despite the
  # shared source, and both are why its symbols have to be renamed rather than
  # shared:
  #
  # 1. It was linked against a DIFFERENT ENGINE BUILD. It calls printf at
  #    0x8007C040 and exit at 0x8007BEF0, which in the shipped executable land
  #    inside libgte's `rcossin_tbl`. Its external addresses are unusable.
  # 2. Its data is its own copy at 0x8040xxxx and NOT at a constant offset
  #    from the live overlay's: `card_slot` is 0x800287CC live and 0x804094EC
  #    here, a delta of 0x3E0D20, while the data regions' bases differ by
  #    0x3E1320. Both blocks are in ONE container, so one symbol name cannot
  #    resolve to two addresses.
  #
  # rodata keeps its own NAME (`..._rodata`) and stays UNDOTTED. Undotted is
  # what disassembles it unconditionally; the dotted form would migrate it
  # into the C unit, and migration only emits a symbol it can ATTRIBUTE to a
  # function -- which is how the live overlay's message pool was written
  # nowhere and left the container 0x864 bytes short (see the `hrodata` note
  # 100 lines up). A DIFFERENT name is what keeps it undotted: an undotted
  # subsegment sharing the `c` unit's name is a hard error. The function
  # pointer table at +0x269058 and the nine filenames live here and are
  # claimed later, the same way as the `data_pre`/`data_post` chunks above.
  - type: code
    start: 0x269000
    vram: 0x80400000
    subsegments:
      # THE SPLIT IS THE JUMP TABLE AND NOTHING ELSE, and both halves of that
      # are forced. There is exactly one jumptable in this rodata,
      # jtbl_8040007C (five words, at the offset splat's own "likely file
      # split" suggestion names), and its entries are `.L` labels inside
      # func_804016D0's text. A local label is only visible in the object that
      # defines it, so the table MUST ride in the same object as the code:
      # undotted, it links as five undefined references to `.L80401770` and
      # friends. Dotted, splat migrates it into that function's nonmatchings
      # listing, which is part of the C unit's object. Hence the dotted
      # subsegment, and hence it covers 0x14 bytes.
      #
      # Everything else must NOT migrate. Migration only emits a symbol it can
      # ATTRIBUTE to one function, and this block's rodata is mostly the
      # opposite of that: ASSERT_FMT and the nine translation-unit filenames
      # are referenced from dozens of functions each, so splat attributes them
      # to nobody and writes them NOWHERE -- 13 of the 263 functions took
      # their rodata along and the link then failed on undefined D_80400894 /
      # D_8040086C, which are `cardsme.c` and `memory.c`. Undotted with their
      # own names is what disassembles them unconditionally. Same lesson as
      # the live overlay's message pool 170 lines up, reached from the other
      # direction: there an undotted subsegment was needed because nothing
      # referenced the pool, here because everything does.
      - [0x269000, rodata, ovl_main_80400000_rodata_pre]
      - [0x26907c, .rodata, ovl_main_80400000]
      - [0x269090, rodata, ovl_main_80400000_rodata_post]
      - [0x2698a0, c, ovl_main_80400000]
  - [0x2719e0, bin]
  - [0x275800]

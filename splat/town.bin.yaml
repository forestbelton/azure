name: town.bin
sha1: b946a57aa5fc8cec29db3ecabad6e6b76df418b7
options:
  basename: town.bin
  target_path: data/town/town.bin
  base_path: ..
  platform: psx
  compiler: GCC
  extensions_path: splat/ext

  create_asm_dependencies: False

  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_dependencies: False
  # TODO: We may be able to turn this off once more of the binary is mapped
  ld_legacy_generation: True
  ld_script_path: build/town.bin.ld

  subalign: 4

  find_file_boundaries: False
  gp_value: 0x80080994

  o_as_suffix: True
  use_legacy_include_asm: False

  # Without this splat writes the overlay's C file to the default src/, which
  # here is the azure python package, and the Makefile's CFILES (a find over
  # csrc/) would never pick it up.
  src_path: csrc

  symbol_addrs_path: splat/town.bin_symbol_addrs.txt
  reloc_addrs_path: splat/town.bin_reloc_addrs.txt

  undefined_funcs_auto_path: splat/town.bin_undefined_funcs_auto.txt
  undefined_syms_auto_path: splat/town.bin_undefined_syms_auto.txt
segments:
  # - type: code
  # start: 0x0
  # vram: 0x8002D000
  # subsegments:
  # - [0x0, bin]
  # - [0x6f681e, az_string, STR_ANGEL_GREETING]
  # - [0x6f69fe, bin]
  #
  # THE 22-SECTOR PREAMBLE. These 0xb000 bytes are byte-identical to
  # main.bin's first 0xb000 and dungeon.bin's diverge from them at exactly
  # 0x7800, which is where docs/dungeon-map.md puts that container's unplaced
  # head code -- so all three containers are built on one preamble and dungeon
  # overwrites part of it. Nothing loads it: no descriptor in slus_006.14 or
  # in either mapped overlay targets either address.
  #
  # The sequence is a complete KCET/TSDB/KDT container, 13 tracks, 0x2938
  # bytes, and 0x2938..0x3000 is its pad. The bank is NOT complete: its header
  # is internally consistent (header size plus the summed VAG size table
  # equals its own `fsize` to the byte, as it does for all 17 banks here) but
  # declares 0x1C310 bytes where only 0x8000 are present -- the overlay starts
  # at 0xb000 and the waveform is cut mid-sample. The bytes up to 0xb000 are
  # SPU ADPCM. See docs/town-map.md.
  - [0x0, bin, snd_preamble_seq]
  - [0x3000, bin, snd_preamble_vab]
  # The town overlay: 1815 functions at 0x80088760, which is the first byte
  # after the resident engine's last (0x8008875F) -- the layout
  # docs/overlays.md predicted but could not place. dungeon.bin's overlay
  # loads at the SAME address, so the two are mutually exclusive at runtime
  # and one address means different code in each; see that doc.
  #
  # Located by matching the 49 overlay function addresses in
  # slus_006.14_undefined_funcs_auto.txt against this file's
  # `addiu sp,sp,-N` prologues (15/49 at this delta, next best 6), then
  # confirmed by the block's own jal targets landing on its own prologues
  # (536 votes, noise floor 0). +0xb000 is the sector-aligned offset that maps
  # to 0x80088760, and the game seeks exactly there (LBA 3099) when loading
  # the town -- caught in a PCSX-Redux CD-ROM command log.
  #
  # rodata first, code from +0xd524 (gcc -G8 data-before-functions), which is
  # why the block opens on Shift-JIS text.
  #
  # +0xd524 and NOT the +0xd630 the prologue fingerprinting reported. The
  # vote scans for `addiu $sp, $sp, -N`, so it cannot see a FRAMELESS LEAF
  # FUNCTION, and four of them sit at the bottom of the text: func_8008AC84,
  # func_8008ACAC, func_8008ACE8 and func_8008AD1C, 67 words in all, each
  # with its own `jr $ra` and each the target of a `jal` from inside the
  # overlay. At +0xd630 they came out as `.word` blocks in the rodata stream
  # -- byte-identical either way, but unreachable from C forever. The data
  # really does end at +0xd524: the Shift-JIS block D_8008998C runs
  # 0x8008998C..0x8008AC80 inclusive and stops there. Expect the same class of
  # error at dungeon.bin's +0xa3e28, which was found the same way.
  # Three things had to be right before this could be in the build; the
  # earlier attempt got all three wrong and failed with
  # `undefined reference to jtbl_80089900`.
  #
  # 1. `.rodata` WITH the dot -- because csrc/ovl_town.c now exists. The dot
  #    routes a subsegment to a SIBLING C OBJECT (see the note on the slus
  #    segment's own `.rodata` entries), so it is WRONG without one and
  #    REQUIRED with one: splat refuses the undotted form on a `c` subsegment
  #    outright. While this overlay was `asm` the plain form was correct and
  #    wrote asm/data/ovl_town.rodata.s with 73 `dlabel`s in it (jtbl_80089900
  #    and D_80089960 among them); dungeon.bin, still `asm`, keeps that form.
  #    With the dot splat instead migrates each rodata symbol into the
  #    nonmatching listing of the one function that references it, which is
  #    what places the jump tables without any manual work. The failure mode
  #    of getting this backwards is `undefined reference to jtbl_80089900`.
  #    See docs/overlays.md, "The rodata dot".
  # 2. The code subsegment needs a FOLLOWING segment. Without one it runs to
  #    the end of the container and splat disassembles the remaining 16 MB as
  #    a single 4.3-million-line file.
  # 3. The boundary is 0x51fc0, not the 0x51ed8 the fingerprinting reported.
  #    0x51ed8 is where the confirmed prologue run ended; the word there is
  #    `addiu $sp, $sp, -0x20`, the start of one more function. The last
  #    `jr $ra` is at 0x51fb8, so the text ends at 0x51fc0 -- which is also
  #    16-byte aligned, and that matters: splat emits
  #    `__romPos = ALIGN(__romPos, 16)` after a code segment, so a boundary at
  #    0x51ed8 inserts eight bytes of padding and the container comes out
  #    eight bytes long.
  #
  # Verified: `make` rebuilds town.bin byte-identical with these segments live.
  - type: code
    start: 0xb000
    vram: 0x80088760
    subsegments:
      - [0xb000, .rodata, ovl_town]
      # The two rodata splits this file's own note below predicted. They are
      # NOT cosmetic: cc1psx emits `.align 3` for every jump table, and
      # jtbl_800898AC sits at rodata offset 0x114C, which is 4 mod 8 -- so
      # compiled inside one big unit it gains four bytes of pad the reference
      # does not have, .rodata goes 0x2524 -> 0x252C, and the container is
      # eight bytes long. The reference has no missing alignment: the whole
      # ORIGINAL translation unit sat at 4 mod 8, and `subalign: 4` above (plus
      # SUBALIGN(4) in the generated linker script) is what reproduces that.
      # So the fix is to give those functions their own unit whose rodata
      # STARTS at 0x114C, where `.align 3` is a no-op.
      #
      # 0xc1a0 is the boundary condition and is not optional: the middle unit's
      # rodata must END at 0x80089900 so the tail unit begins with
      # func_800BF4CC's table at tail-offset 0. Put the split anywhere later
      # and jtbl_80089900 lands at 4 mod 8 and gets padded instead -- the same
      # bug one symbol further on. With it here, every later `.align 3` in the
      # tail lands 0 mod 8: D_80089918 at 0x18, jtbl_80089930 at 0x30,
      # D_80089944 at 0x44, D_80089960 at 0x60, jtbl_80089978 at 0x78,
      # D_8008998C at 0x8C. The unit's other fifteen tables are all below
      # 0x800898AC and unaffected.
      #
      # Evidence and the measurement trail: docs/near-misses/func_800BEBA4.c.
      - [0xc14c, .rodata, ovl_town_800BEBA4]
      - [0xc1a0, .rodata, ovl_town_800BF3F0]
      - [0xd524, c, ovl_town]
      - [0x41444, c, ovl_town_800BEBA4]
      - [0x41c90, c, ovl_town_800BF3F0]
      # THE OVERLAY'S OWN DATA, which this file used to file as unnamed `bin`
      # along with 16 MB of assets. The engine's overlay load table at vram
      # 0x80080C38 holds `{nsec << 23 | dest, LBA}` descriptors and asks for
      # **278 sectors** from LBA 3099, which is 0xb000..0x96000 -- not the 142
      # sectors of rodata and text above. 278 is
      # ceil((0x95AC4 - 0xb000) / 0x800), and 0x95AC4 is independently where
      # the mastered filler run starts, so the two agree on a file length of
      # 0x8AAC4 and the read rounds it up to a sector.
      #
      # Three measurements say 0x51fc0..0x7dcb8 is this overlay's data rather
      # than an asset that happens to sit here:
      #
      # 1. The overlay's C already references 791 symbols at or above
      #    0x800CF720 and the LOWEST of them is exactly 0x800CF720 -- the
      #    first byte after the text. They run up to 0x800FE5D8, which is past
      #    the end of the read and therefore .bss.
      # 2. 1,265 words in the region fall inside the overlay's own text range
      #    and 934 of them (74%) land exactly two words after a `jr $ra`, by
      #    the function-start test tools/decomp/codemap.py is built on. The
      #    same test over 0x96000..0x120000 of the filler finds 7 candidates
      #    and 0 hits.
      # 3. 8,399 words in the region point back into the region.
      #
      # It ends at 0x7e000 and not 0x7dcb8 because splat emits
      # `__romPos = ALIGN(__romPos, 16)` after a code segment: a boundary at
      # 0x7dcb8 inserts eight bytes of pad and the container comes out eight
      # bytes long, which is the same trap the text-end note above records.
      # 0x7dcb8..0x7e000 is zero either way.
      #
      # This is `data` and not `.data`: the dot routes a subsegment to a
      # SIBLING C OBJECT (see the `.rodata` note above) and there is no
      # csrc/ovl_town_data.c. Carving these 179,448 bytes into the three units
      # the way docs/owning-data.md describes for main.bin's card overlay is
      # the next step and is NOT done here.
      # TRANCHE 1 is owned by csrc/ovl_town.c -- 0x51fc0..0x52548, the 23
      # objects at 0x800CF720..0x800CFC24. The window is a PREFIX and has to
      # be: under `ld_legacy_generation` a segment emits one DATA group, and
      # in it every C object comes before every asm data object (confirmed
      # against build/main.bin.ld's card overlay, which lists its nine units,
      # then ovl_main_80020000.o, then the pad). So the bytes a C unit owns are
      # the FIRST bytes of the region, and the window grows upward from here.
      #
      # It goes to ovl_town rather than to one of the other two units because
      # ovl_town is first in link order, which is the only claim the evidence
      # supports: this overlay has no assert records to name its original
      # units (docs/overlays.md) and the reference signal is noise -- 83
      # symbols used only by ovl_town sit ABOVE the first symbol used only by
      # ovl_town_800BF3F0, and 54 of the latter sit below the last of the
      # former, so no contiguous three-way assignment fits. See
      # docs/owning-data.md, "The town overlay has no unit oracle".
      - [0x51fc0, .data, ovl_town]
      - [0x52548, data, ovl_town_data]
  # The remainder of the 278-sector read: zero, apart from three single-island
  # strays at 0x82800 (3 bytes), 0x83000 (30 bytes, Shift-JIS fragments and
  # the pointer 0x80031B58) and 0x93000 (1 byte), and then the first 1,340
  # bytes of the filler run below, which begins at 0x95AC4 -- inside the read
  # but above everything the overlay references, so it lands in RAM that
  # __main zeroes.
  - [0x7e000, bin, ovl_town_read_tail]
  # 1,529,148 bytes of mastered filler, with the fingerprint
  # docs/main-bin-data.md closed that container's dead region with: entropy
  # 7.9999, zero fraction 0.00397, chi-square 251.8, and both zlib and xz
  # EXPAND it. It ends exactly where the first image blob begins. Nothing
  # reads it; do not spend time on it.
  - [0x96000, bin, filler]
  # Everything the game shows or plays: 80 image blobs, 33 KCET sequences, 16
  # VAB banks, 43 runs of tier-2 code, 272 sectors of Shift-JIS script (the
  # English one in full-width characters and the Japanese one still beside
  # it), and the two symbol tables that name 3,587 of the original source's
  # identifiers.
  #
  # NOT enumerated here, on purpose. Every blob, bank and sequence in it has a
  # byte-exact extent, but they interleave with code runs whose ends are only
  # sector-granular, so a per-asset segment list would be ~250 entries of
  # which some are guesses, and one arithmetic slip in it breaks the link.
  # `python3 tools/scan-container.py town.bin --anchors` is the inventory and
  # is regenerated from the image; docs/town-map.md reads it.
  - [0x20b000, bin, assets]
  # 2,773 sectors, 1,956 of them (71%) entirely zero, and not one image blob,
  # sound bank or sequence in the whole 5.4 MB. It opens with a PSY-Q debugger
  # CONFIGURATION FILE in ASCII -- `#version / 4.112`, `#readram0`,
  # `#writeram0` over 8 MB of RAM, `#video`, `#default tabs`, `#window` -- and
  # continues as a 0x6000 period of mostly-zero blocks whose small non-zero
  # islands carry the game's default character names and pointers into the
  # tier-2 overlays' RAM band. 0x6000 is one banked overlay slot
  # (docs/dungeon-map.md). Dev-machine residue in reserved space.
  - [0x9fb000, bin, dev_tail]
  # 72 more image blobs. The last 111 sectors are a dense run of small ones
  # carrying only type-3/type-4 records -- compressed or copied RAM payloads
  # rather than textures.
  - [0xf65800, bin, asset_blob_tail]
  - [0x101b800]

  subalign: 4

  find_file_boundaries: False
  gp_value: 0x80080994

  o_as_suffix: True
  use_legacy_include_asm: False

  asset_path: assets/main
  src_path: csrc

  symbol_addrs_path: splat/main.bin_symbol_addrs.txt

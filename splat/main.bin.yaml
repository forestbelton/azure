name: main.bin
sha1: 69f63236b7ab2260e2e9aa2048ce7aa540bdbe6d
options:
  basename: main.bin
  target_path: data/main/main.bin
  base_path: ..
  platform: psx
  compiler: GCC
  extensions_path: splat/ext

  create_asm_dependencies: False

  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_dependencies: False
  # TODO: We may be able to turn this off once more of the binary is mapped
  ld_legacy_generation: True
  ld_script_path: build/main.bin.ld

  subalign: 4


  find_file_boundaries: False
  gp_value: 0x80080994

  o_as_suffix: True
  use_legacy_include_asm: False

  asset_path: assets/main
  src_path: csrc

  symbol_addrs_path: splat/main.bin_symbol_addrs.txt
  reloc_addrs_path: splat/main.bin_reloc_addrs.txt

  undefined_funcs_auto_path: splat/main.bin_undefined_funcs_auto.txt
  undefined_syms_auto_path: splat/main.bin_undefined_syms_auto.txt
segments:
  - [0x0, bin, song1.kdt]
  - [0x3000, bin, unk.vab]
  - [0x3800, bin]
  - [0x20000, bin, kewne_loading_img]
  - [0x20800, shiftjis, str/main/beldo]
  - [0x2080c, shiftjis, str/main/rock]
  - [0x20818, shiftjis, str/main/storm_wall]
  - [0x20830, shiftjis, str/main/ice_wall]
  - [0x20844, shiftjis, str/main/fire_wall]
  - [0x20858, shiftjis, str/main/selfi]
  - [0x20864, shiftjis, str/main/ghosh]
  - [0x20870, shiftjis, str/main/guy]
  - [0x20878, shiftjis, str/main/salaman]
  - [0x20888, shiftjis, str/main/frog]
  - [0x20894, shiftjis, str/main/rainbow]
  - [0x208a4, shiftjis, str/main/maximum_egg]
  - [0x208c4, shiftjis, str/main/maximum]
  - [0x208d4, shiftjis, str/main/vermilion]
  - [0x208e8, shiftjis, str/main/golem_egg]
  - [0x20904, shiftjis, str/main/cinnabar]
  - [0x20924, shiftjis, str/main/tyrant_egg]
  # The rest of the name/colour/egg-description pool the `str/main/*` segments
  # above start: 0x20940 opens on "TYRANT" and continues the same
  # (NAME, colour, "A NAME egg.") triplets in full-width Shift-JIS, which is
  # how the US release renders Latin text in the Japanese font. Still `bin`
  # because splitting it into `shiftjis` segments needs the 4-aligned-boundary
  # check in docs/data-map.md; the text proper ends at 0x21280.
  - [0x20940, bin, str/main/pool_tail]
  # Pointer and index tables, then 11 KB of unidentified fixed-size records,
  # then zero padding from 0x24440. The game reads this: the CD-ROM command
  # log seeks main.bin+0x20800 and +0x21800. 144 of its words are pointers
  # into 0x8002c094..0x8008b270, i.e. into the resident executable's own RAM,
  # so it is a relocated resource rather than a standalone file.
  - [0x21280, bin, main_tables_21280]
  # DEAD FILLER, 2,069,472 bytes (0x1F93E0) -- the single largest unmapped run
  # in any container, and it holds nothing. It is kept as a named `bin` for the
  # same reason as slus_006.14's `tail_unloaded`: so splat stops calling it
  # unknown and nobody spends another pass on it.
  #
  # The game never reads it. A PCSX-Redux CD-ROM command log covering boot,
  # title, town and dungeon (78 distinct seeks) hits main.bin at exactly 11
  # offsets -- +0x0, +0x3000, +0x4800, +0x20000, +0x20800, +0x21800, then
  # straight to +0x221800, +0x226800, +0x257000, +0x258800, +0x25d000. The one
  # gap in that list is this run, to the sector. There is also no resource
  # table to reach it with: neither slus_006.14 nor main.bin contains the
  # sector numbers (67, 1091, 1101, 1198, 1201, 1210) or the byte offsets
  # (0x221800, 0x226800, 0x257000, 0x258800, 0x25d000) of the known resources
  # as a u16 or u32 table anywhere.
  #
  # It is nevertheless real, deliberately mastered content, not a dump
  # artifact: all 1011 of its CD sectors (LBA 1897..2907) carry a VALID EDC
  # over bytes 16..2071, checked against the Mode 2 Form 1 layout and
  # validated on known-good sectors first.
  #
  # What it is NOT, each tested rather than assumed:
  #   - not compressed game data -- it is incompressible. zlib -9 returns
  #     100.03% of input and xz 100.02%; both expand it.
  #   - not any PRNG fill. Berlekamp-Massey over its bits gives linear
  #     complexity exactly n/2+1 (1001 at 2000 bits, 10001 at 20000), the
  #     random signature, so no LFSR generated it; and solving
  #     x[n+1] = a*x[n] + c mod 2^32 from three consecutive words predicts
  #     2 of 4095 at every alignment and endianness tried, so no word LCG did.
  #   - not SPU-ADPCM and not XA-ADPCM. The 16-byte-block test scores 0.2543 /
  #     0.0324 against a random baseline of 0.254 / 0.031 at every phase, and
  #     0 of 16167 128-byte groups show the XA sound-group header redundancy.
  #   - not images -- no TIM header occurs in it at any 4-aligned offset.
  #   - not a copy of anything else on the disc. Six 24-byte needles taken
  #     across it each occur exactly ONCE in all 298 MB of az.bin: here.
  #   - not the disc's own padding convention. /STR/DUMMY_.STR and
  #     /STRT/DUMMYM.STR are 99.6% zeros (16 bytes of 0x0c, then zero fill,
  #     one sector repeated 166 times); this is nothing like them.
  #   - not a file-wide pre-fill either. Every OTHER gap in main.bin is zeros
  #     (0x24440..0x28420, 0x265000, 0x2719e0 all 90-99.9% zero), so only this
  #     one run was filled this way.
  #
  # What it measures as: 2,069,472 bytes at H = 7.9999 bits/byte, chi-square
  # 218.5 on 255 df, zero fraction 0.00392 = 1/256, longest zero run in the
  # whole 2 MB just 2 bytes, and 0 anomalous windows out of 16167 scanned at
  # 128-byte resolution. That is indistinguishable from uniform random, and it
  # is the SAME fingerprint as slus_006.14's `tail_unloaded` (176,128 bytes,
  # H = 7.9989, chi-square 268.7, zero fraction 0.00374), which docs/data-map.md
  # reached the same dead end on. Two regions, one explanation.
  #
  # The one structural fact worth recording: it ends at 0x221800, and
  # 0x221800 - 0x21800 = exactly 0x200000. Read with the segment above, the
  # resource the game loads at +0x21800 sits at the head of a round 2 MiB
  # reservation whose unwritten remainder is this run. That makes it a
  # reserved hole keeping the images at +0x221800 and beyond on fixed sector
  # offsets -- which is why it must still be reproduced byte for byte by
  # `make containers` even though nothing reads it.
  #
  # Do not spend time on it.
  - [0x28420, bin, unread_filler]
  - [0x221800, bin, unk_img_1]
  - [0x226800, bin, title_bg_img]
  - [0x257000, bin, title_menu_img]
  - [0x258800, bin, unk_img_2]
  # The low-RAM overlay: 130 functions at 0x80020000, in the 0x80010000
  # region the engine reaches with the out-of-image constant-base-pointer
  # idiom (docs/addressing-and-translation-units.md) rather than above the
  # engine like town's and dungeon's.
  #
  # Found without any symbol list, by matching the block's own `jal` targets
  # against its `addiu sp,sp,-N` prologues and taking the offset-to-address
  # delta with the most agreement: 130 hits here against a noise floor of 0
  # (the same test on town.bin scored 536 for the known answer and 0-16 for
  # eight random deltas). Corroborated three ways: +0x25d000 is sector
  # aligned, it maps to a round 0x80020000, and the game seeks exactly there
  # (LBA 3027) -- caught in a PCSX-Redux CD-ROM command log.
  #
  # rodata first, code from +0x924: gcc 2.7.2 at -G8 emits data ahead of
  # functions, which is also why the block opens on an "Assertion failed"
  # string rather than instructions.
  # The three corrections eec0572 worked out on town.bin apply here unchanged:
  # `rodata` and not `.rodata` (the dot routes the subsegment to a sibling C
  # object and extracts nothing, so every reference into the overlay's own
  # rodata comes out undefined); a FOLLOWING segment, or the code subsegment
  # runs to the end of the container; and a text end on a 16-byte boundary,
  # because splat emits `__romPos = ALIGN(__romPos, 16)` after a code segment
  # and a boundary off that grid pads the container.
  #
  # The text ends at 0x264e20: the last `jr $ra` is at 0x264e18 and its delay
  # slot follows, and the words after it are pointers into 0x800284xx, so the
  # overlay's own data continues there. 77b2c94 reported 0x264c90, which is
  # 0x190 bytes short.
  - type: code
    start: 0x25d000
    vram: 0x80020000
    subsegments:
      # `.rodata` WITH the dot, now that there is a sibling C unit. The
      # dotted form is what splat requires for rodata migration -- an
      # undotted `rodata` beside a `c` subsegment is a hard error ("not
      # prefixed with a dot, which is required for the rodata migration
      # feature"). The warning in town.bin.yaml and dungeon.bin.yaml is the
      # same rule seen from the other side: there, with no C unit to migrate
      # INTO, the dot routes the subsegment to a sibling object that does not
      # exist and extracts nothing. The dot is right exactly when a `c`
      # sibling exists.
      - [0x25d000, .rodata, ovl_main_80020000]
      # The Shift-JIS UI message pool, 0x864 bytes, carved out of the migrated
      # rodata as an UNDOTTED `rodata` subsegment with its own name -- the
      # exact mirror of the `data_pre`/`data_post` chunks below.
      #
      # It has to be carved, not left to migration: rodata migration only
      # emits a symbol it can ATTRIBUTE to a function, and nothing references
      # the pool. Splitting D_800200B8's 0x86C-byte object into the 8-byte
      # RECT plus this (see splat/main.bin_symbol_addrs.txt) left the pool
      # unreferenced, and splat then wrote it NOWHERE -- no listing, no
      # warning, a container 0x864 bytes short. An undotted subsegment is
      # disassembled unconditionally, which is the fix.
      #
      # `hrodata` and not `rodata`: splat/ext/hrodata.py seeds the file into
      # asrc/ once and then never rewrites it, which is what lets the pool be
      # kept as readable `.shiftjisz "..."` text instead of `.word` blobs.
      # SFILES globs asrc/ alongside asm/ and the `build/%.o: %.s` rule pipes
      # every asm source through `azure shiftjis`, so the directive expands.
      # A nonmatchings listing could never do this: those are assembled as
      # part of the C object, through maspsx, which never sees that filter.
      #
      # 59 NUL-terminated Shift-JIS strings, each padded to 4 -- exactly the
      # `.shiftjisz` layout -- except the LAST, whose three padding bytes are
      # 05 61 64 rather than zeros, so it is spelled out by hand. One entry,
      # 0x80020688, is the empty string, and it is referenced three times.
      #
      # The 0x1E0-byte table at 0x800280B4 is what indexes into this pool: 121
      # words in the `bin` at 0x265000 point in here. They are raw bytes with
      # no relocations today, which is why the per-message labels below are
      # not yet load-bearing -- claiming that table is what will need them.
      - [0x25d0c0, hrodata, ovl_main_80020000_rodata_pool]
      # `c`, not `asm`: this overlay is being decompiled. The unit is built at
      # cc1psx -G0, NOT the -G8 the resident executable uses, and the Makefile
      # has the per-unit override. -G is not cosmetic here: at -G8 cc1psx
      # records `.extern SYM,4` and a global access comes out as the
      # assembler-expanded `lui $at` / `%lo` pair, while at -G0 it emits its
      # own `%hi`/`%lo` split address into a general register, which is the
      # hoisted-lui shape this block uses. Nothing in the overlay is
      # $gp-relative (0 refs), and it could not be: the block's data at
      # 0x80027E20 is far outside $gp's +/-32K window around 0x80080994.
      - [0x25d924, c, ovl_main_80020000]
      # The overlay's .data, which begins the instant the text ends. It is
      # split in two because splat has NO per-symbol migration for `.data` --
      # that exists for `.rodata` only (see csrc/ovl_main_80020000.c's
      # INCLUDE_RODATA stubs). A dotted `.data` subsegment writes no assembly
      # at all and the C unit must define every byte of it, so the range the C
      # unit owns is carved off and the remainder stays an ordinary undotted
      # `data` subsegment that splat keeps disassembling.
      #
      # `ovl_main_80020000_data_pre` is the NOT-YET-OWNED part, and its name
      # must differ from `ovl_main_80020000` or splat would make it a sibling
      # of the C unit and link the same object's .data twice.
      #
      # The owned window is ONE contiguous range -- splat keys siblings by
      # section name, so a unit gets exactly one `.data` subsegment. It grows
      # in either direction: lower its start to claim the object below (and
      # `_data_pre` shrinks to match), or raise its end to claim the object
      # above (and the following segment's start moves up with it). Both
      # boundaries are hand-maintained and both have to track the C file.
      #
      # docs/owning-data.md is the procedure, with this change as its worked
      # example.
      - [0x264e20, data, ovl_main_80020000_data_pre]
      - [0x264f18, .data, ovl_main_80020000]
      # The data above the owned window, as a second undotted `data`
      # subsegment rather than a top-level `bin`.
      #
      # THIS IS WHY, and it cost a 0x10-long container on 2026-11-08. splat
      # emits `__romPos = ALIGN(__romPos, 16)` after a code segment, so the
      # segment's END must sit on a 16-byte boundary -- the same rule the text
      # end obeys, 150 lines up, applied to the far end of the same segment.
      # While the tail was a top-level `bin`, the segment ended wherever the
      # `.data` window ended, so moving the window to 0x264f48 to claim
      # D_80027F30 (0x18 bytes, ending 8 short of the grid) slipped
      # `_25D000_ROM_END` to 0x264f50 and then slipped the 0x80400000 segment's
      # end by another 8 at the second ALIGN, for 0x275810 bytes against
      # 0x275800. Every boundary INSIDE the overlay was correct; the overshoot
      # was entirely in the two aligns.
      #
      # Ending the segment at 0x265000 fixes it permanently: the boundary you
      # now move to claim an object is purely internal to the segment, between
      # this chunk and the `.data` window above it, so segment alignment never
      # enters into it again.
      - [0x264f60, data, ovl_main_80020000_data_post]
  - [0x265000, bin]
  # The second code run, RESOLVED 2026-11-01 to 0x80400000. An earlier pass
  # left it as bin, reporting "only 58 internal jal targets and the best
  # delta scored 6 against a floor of 5, which is noise" -- that measurement
  # was wrong, not the method. Voting this block's own `jal` targets against
  # its own `addiu sp,sp,-N` prologues over the full +0x269000..+0x272000
  # span gives 654 jal sites to 265 distinct targets, 191 prologues, and
  # **142 hits at this delta against a next-best of 33** -- the same
  # second-vote test that placed the other three overlays.
  #
  # Four independent confirmations, so the vote is not carrying this alone:
  #
  # 1. The function-pointer table at +0x269058 holds 0x804010F0, 0x804013D0,
  #    0x804013A8, 0x804012B0, and the last two ARE prologues at the
  #    predicted file offsets (0x26A2B0, 0x26A22C: `addiu $sp, $sp, -0x20`
  #    and `-0x18`).
  # 2. The code builds its addresses as `lui $at, 0x8041`, e.g.
  #    `lui $at, 0x8041; sw $v0, -0x6B14($at)` -> 0x804094EC, which lands in
  #    this block's own data.
  # 3. Text ends at 0x2719dc and the `.data` immediately after it is
  #    pointers 0x80409140 / 0x8040914C / 0x80409158 / 0x80409164.
  # 4. 0x80400000 is upper RAM on an 8 MB DTL-H2000 development board, which
  #    is why nothing loads it on retail and why the CD-ROM command log shows
  #    no seek here. It is DEAD CODE on the shipped disc -- but it is in the
  #    container, so `make containers` still has to reproduce it.
  #
  # What it is: a DEBUG BUILD OF THE SAME SOURCE as the 0x80020000 overlay
  # above, with asserts compiled in. 50.4% of the live overlay's 7487 words
  # are covered by shared masked instruction runs with this block, the
  # longest 121 words, and the function pointers correspond one-to-one with a
  # small shift from the assert calls (0x800210F0 -> 0x804010F0,
  # 0x80021298 -> 0x804012B0). That makes this block an oracle for the live
  # overlay rather than just more work: its rodata carries nine translation
  # unit names from the original source -- c_server.c, card_mes.c,
  # card_opt.c, card_win.c, cardbk.c, cardinfo.c, cardslot.c, cardsme.c and
  # memory.c -- against the live overlay's one, plus a `__LINE__` immediate
  # at every assert site and the assert EXPRESSIONS, which leak real
  # identifiers (`card_first_flg`, `(int)gsw->check_sum`).
  #
  # Boundaries. rodata is 0x269000..0x2698a0: the last string is "memory.c"
  # at 0x269894 and 0x2698a0 is the first prologue. Text END IS 0x2719e0,
  # NOT 0x2719dc: the last `jr $ra` is at 0x2719d4 and its delay slot at
  # 0x2719d8, so the code proper stops at 0x2719dc, but splat emits
  # `__romPos = ALIGN(__romPos, 16)` after a code segment and 0x2719dc is off
  # that grid -- a boundary there pads the container. 0x2719e0 takes one word
  # of the three zero words of padding into .text and is 16-byte aligned.
  # The block's data starts at 0x2719e8.
  - type: code
    start: 0x269000
    vram: 0x80400000
    subsegments:
      - [0x269000, rodata, ovl_main_80400000]
      - [0x2698a0, asm, ovl_main_80400000]
  - [0x2719e0, bin]
  - [0x275800]

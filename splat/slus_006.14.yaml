      # between __bss and the end of t_size, which is 0x800-rounded. NOT
      # ownable in C at any -G: a definition with no initialiser is NOBITS and
      # contributes no file bytes, and one WITH an initialiser would be .data
      # and would have to sit below. It stays disassembled.
      - [0x54c38, data, gp_sbss]
      # AND THE LAST 0x240 BYTES ARE NOT .sbss, THEY ARE MASTERING SLACK.
      # 0x54DC0 is vram 0x800815C0, which is where libsn/SNMAIN's module
